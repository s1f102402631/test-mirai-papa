<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>みらいパパ ― 未来の育児シミュレーター</title><link rel="stylesheet" href="style.css"><style>
/* ナビゲーションだけを調整。既存の「みらいパパ」のデザインは変更しない */
.brand{appearance:none;-webkit-appearance:none;background:transparent;border:0;padding:0;margin:0;color:var(--gold);cursor:pointer;font:inherit}
.quick-icon.external-box{background:transparent!important;border:0!important;border-radius:0!important;color:inherit!important}
.back-link{appearance:none;-webkit-appearance:none;background:transparent!important;border:0!important;box-shadow:none!important;color:var(--cream-dim);padding:0;margin:0;min-width:0;width:auto!important;font-family:var(--font-mono);font-size:15px;line-height:1;cursor:pointer;align-self:flex-start}
.back-link:hover{background:transparent!important;border:0!important;color:var(--gold)}
.survey-submit{width:auto!important;min-width:72px;padding:9px 18px!important;font-size:12px!important;border-radius:9px!important;align-self:center}
.survey-back{appearance:none;-webkit-appearance:none;background:transparent!important;border:0!important;box-shadow:none!important;color:var(--cream-dim);padding:0;margin:0;width:auto!important;font-family:var(--font-mono);font-size:15px;line-height:1;cursor:pointer;align-self:flex-start}
.survey-back:hover{color:var(--gold)}
.info-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px}
.info-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.info-filters::-webkit-scrollbar{display:none}
.info-filter{flex:0 0 auto;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--cream-dim);padding:6px 10px;font:11px var(--font-body);cursor:pointer}
.info-filter.active{border-color:var(--gold);color:var(--gold);background:rgba(232,184,109,.08)}
.matrix-wrap{position:relative;height:300px;margin:14px 0 8px;border:1px solid var(--border);border-radius:18px;background:var(--panel-light);overflow:hidden;touch-action:none;cursor:grab}
.matrix-wrap.dragging{cursor:grabbing}
.matrix-canvas{position:absolute;left:0;top:0;width:620px;height:620px;transform-origin:0 0}
.matrix-grid{position:absolute;left:20px;top:20px;width:580px;height:580px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border:1px solid rgba(246,239,226,.14);background:rgba(255,255,255,.015)}
.matrix-grid::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:1px solid rgba(246,239,226,.13)}
.matrix-grid::after{content:'';position:absolute;top:50%;left:0;right:0;border-top:1px solid rgba(246,239,226,.13)}
.matrix-quadrant{padding:16px;position:relative}
.matrix-quadrant strong{display:block;font:13px var(--font-mono);color:var(--gold);margin-bottom:5px}
.matrix-quadrant span{font-size:10px;color:var(--cream-dim)}
.matrix-point{position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid var(--cream);background:var(--gold);box-shadow:0 0 0 5px rgba(232,184,109,.12);transform:translate(-50%,-50%);cursor:pointer}
.matrix-point::after{content:attr(data-label);position:absolute;left:12px;top:13px;white-space:nowrap;font-size:9px;color:var(--cream-dim);pointer-events:none}
.matrix-axis-x,.matrix-axis-y{position:absolute;font:9px var(--font-mono);color:var(--slate);pointer-events:none}
.matrix-axis-x{left:50%;bottom:5px;transform:translateX(-50%)}.matrix-axis-y{left:6px;top:50%;transform:translateY(-50%) rotate(-90deg)}
.matrix-controls{display:flex;gap:5px;position:absolute;right:8px;bottom:8px;z-index:3}
.matrix-controls button{width:28px;height:28px;border:1px solid var(--border);border-radius:8px;background:rgba(31,42,64,.9);color:var(--cream-dim);font:14px var(--font-mono);cursor:pointer}
.matrix-hint{font-size:10px;color:var(--slate);text-align:center;margin-bottom:8px}
.info-section-title{font:11px var(--font-mono);letter-spacing:.08em;color:var(--gold-dim);margin:14px 0 8px}
.info-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.info-tag{font-size:9px;color:var(--gold-dim);border:1px solid var(--border);border-radius:999px;padding:3px 7px}

.info-site-icon{position:absolute;left:14px;top:13px;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}.info-site-icon img{width:24px;height:24px;object-fit:contain}.info-item{position:relative;padding-left:54px!important}.info-back-direct{display:flex;align-items:center;justify-content:flex-start;width:100%;margin:18px 0 2px;padding:0;border:0;background:transparent;color:var(--cream-dim);font:14px var(--font-mono);cursor:pointer;text-align:left}.info-back-direct:hover{color:var(--gold)}

/* home-label-and-info-confirmation-v2 */
.quick-link{font-size:10.5px!important;white-space:nowrap!important;word-break:keep-all!important}
.quick-link .quick-label,.quick-link .label{font-size:10.5px!important;white-space:nowrap!important;word-break:keep-all!important}
/* direct-ui-fix-20260906 */
.quick-link{font-size:10.5px!important;white-space:nowrap!important;word-break:keep-all!important}
.quick-link small{font-size:10.5px!important;white-space:nowrap!important}</style></head>
<body><div class="stars"></div><div class="phone"><div class="topbar"><button class="brand" id="brandHome" aria-label="最初の画面に戻る">みらいパパ</button><div class="dots" id="dots"></div><button class="help-btn" id="helpBtn" aria-label="ヘルプ">?</button></div><div class="content" id="content"></div><div class="footer" id="footer"></div></div><div class="modal-overlay" id="modalOverlay"><div class="modal-box"><h2>このアプリについて</h2><p>「みらいパパ」は、将来父親になるかもしれないあなたが、育児への向き合い方によって変わる10年後の家族の姿を疑似体験できるシミュレーターです。12個の質問に答えると、あなたの今の意識タイプと、2つの未来（育児に関わらなかった場合／積極的に関わった場合）が表示されます。</p><p>結果に正解・不正解はありません。未来は、これからのあなたの選択次第で変えられます。</p><button class="btn btn-primary" id="modalClose">閉じる</button></div></div>
<script>
const ICONS={heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.5s-7.5-4.6-9.8-9.4C.8 7.7 2.4 4.5 5.6 4c2-.3 3.7.6 4.9 2.1L12 7.6l1.5-1.5c1.2-1.5 2.9-2.4 4.9-2.1 3.2.5 4.8 3.7 3.4 7.1-2.3 4.8-9.8 9.4-9.8 9.4z"/></svg>',child:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="3.2"/><path d="M6 21v-3.5C6 14.5 8.5 13 12 13s6 1.5 6 4.5V21"/></svg>',clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5.7 1.5 1.5z"/></svg>'};
const CATS={wife:{label:'妻との関係',icon:'heart'},child:{label:'子どもとの関係',icon:'child'},time:{label:'家族時間',icon:'clock'},growth:{label:'育児への意識',icon:'book'}};
const ROWS={wife:{neg:'すれ違いが増えている',pos:'信頼し合えるパートナーに'},child:{neg:'会話が少ない',pos:'何でも話せる関係に'},time:{neg:'週に1時間未満',pos:'週に10時間以上'},growth:{neg:'育児への関心が薄れている',pos:'学び続け、頼れる存在に'}};
const ACTIONS={wife:'パートナーの話を、最後まで聞く時間をつくる',child:'子どもの行事や送り迎えに、月1回からでも参加してみる',time:'育休制度について、今のうちに調べておく',growth:'育児の本やSNSで、先輩パパの体験談を読んでみる'};
const MESSAGES={neg:{child:'お父さんとはあまり話さなかったな…。でも、今は別に困ってないよ。',partner:'ずっと一人で育児を頑張ってきました。正直、もっと一緒に悩んでほしかった。'},pos:{child:'お父さんがいつも話を聞いてくれたから、今でも何でも相談できるよ。ありがとう。',partner:'一緒に育児を頑張ってくれて、本当に助かりました。あなたのおかげで今の私たちがあります。'}};
const QUESTIONS=[{cat:'wife',text:'家事や育児の分担について、どう考えますか？',opts:[{l:'できる限り半分ずつ担いたい',s:10},{l:'状況に応じて柔軟に分担したい',s:6},{l:'得意な方が多く担当すればいい',s:2}]},{cat:'child',text:'子どもの送り迎えや習い事の付き添いは？',opts:[{l:'自分も積極的に担当したい',s:10},{l:'パートナーと交代でやりたい',s:6},{l:'基本的にはパートナーに任せたい',s:2}]},{cat:'time',text:'休日の過ごし方は、どちらに近いですか？',opts:[{l:'家族との時間を最優先にしたい',s:10},{l:'家族と自分の時間を半々にしたい',s:6},{l:'自分の時間も大切にしたい',s:2}]},{cat:'growth',text:'育児に関する知識や情報を学ぶことについて',opts:[{l:'積極的に学びたい',s:10},{l:'必要になったら学べばいい',s:6},{l:'パートナーに任せておけば十分',s:2}]},{cat:'wife',text:'共働きについて、どう考えますか？',opts:[{l:'積極的にしたい',s:10},{l:'どちらでもよい',s:6},{l:'したくない',s:2}]},{cat:'child',text:'子どもの夜泣きや夜間の対応について',opts:[{l:'自分も交代で対応したい',s:10},{l:'余裕があるときは対応したい',s:6},{l:'基本はパートナーに任せたい',s:2}]},{cat:'time',text:'育児休業の取得について、どう思いますか？',opts:[{l:'できるだけ長く取りたい',s:10},{l:'短期間でも取りたい',s:6},{l:'取らなくてもいいと思う',s:2}]},{cat:'growth',text:'自分のキャリアと育児のバランスについて',opts:[{l:'育児のために働き方を見直したい',s:10},{l:'状況によって調整したい',s:6},{l:'キャリアを優先したい',s:2}]},{cat:'wife',text:'パートナーが悩みや不満を話してきたとき',opts:[{l:'じっくり話を聞き、一緒に考えたい',s:10},{l:'時間があれば聞きたい',s:6},{l:'あまり深く関わりたくない',s:2}]},{cat:'child',text:'子どもの行事（運動会・発表会など）について',opts:[{l:'必ず参加したい',s:10},{l:'できる範囲で参加したい',s:6},{l:'仕事が優先になると思う',s:2}]},{cat:'time',text:'子どもとの時間を確保するために',opts:[{l:'仕事を調整してでも時間を作りたい',s:10},{l:'余った時間でなるべく作りたい',s:6},{l:'特に意識していない',s:2}]},{cat:'growth',text:'将来、子どもにとってどんな存在でいたいですか？',opts:[{l:'何でも話せる、頼れる存在でいたい',s:10},{l:'必要なときに頼れる存在でいい',s:6},{l:'あまり意識していない',s:2}]}];
const TYPES=[{max:30,name:'仕事優先型',desc:'仕事に全力を注ぐ姿勢は、それ自体は立派なことです。ただ、このままでは育児や家庭との時間が後回しになりがち。少しずつ、家庭にも目を向けるバランスを意識してみましょう。'},{max:55,name:'バランス型',desc:'仕事と家庭、両方を大切にしたいという気持ちが伝わってきます。あとは「考える」だけでなく「行動する」一歩が、未来を大きく変えていきます。'},{max:80,name:'育児協力型',desc:'育児に積極的に関わろうとする姿勢が、すでに見えています。この調子で、できることを少しずつ増やしていきましょう。'},{max:100,name:'育児参加型',desc:'家族との時間を何よりも大切にする、理想的な姿勢です。この意識を、これからもずっと大切にしてください。'}];
const SCREENS=['splash','opening','quiz','result','negative','positive','comparison','actions','summary','survey','externalInfo'];let state={screenIdx:0,qIndex:0,answers:[]};
function totalScorePct(){const sum=state.answers.reduce((a,b)=>a+b.s,0);return Math.round(sum/120*100)}function catScores(){const c={wife:0,child:0,time:0,growth:0};state.answers.forEach(a=>{c[a.cat]+=a.s});return c}function getType(pct){return TYPES.find(t=>pct<=t.max)||TYPES[TYPES.length-1]}function weakestOrder(){const c=catScores();return Object.keys(c).sort((a,b)=>c[a]-c[b])}function renderDots(){document.getElementById('dots').innerHTML=SCREENS.map((s,i)=>`<span class="dot ${i===state.screenIdx?'active':i<state.screenIdx?'done':''}"></span>`).join('')}function go(screenName){state.screenIdx=SCREENS.indexOf(screenName);render()}function next(){go(SCREENS[state.screenIdx+1])}function restart(){state={screenIdx:0,qIndex:0,answers:[]};render()}
function render(){renderDots();const screen=SCREENS[state.screenIdx],content=document.getElementById('content'),footer=document.getElementById('footer');content.innerHTML='';footer.innerHTML='';if(screen==='splash')return renderSplash(content,footer);if(screen==='opening')return renderOpening(content,footer);if(screen==='quiz')return renderQuiz(content,footer);if(screen==='result')return renderResult(content,footer);if(screen==='negative')return renderFuture(content,footer,'neg');if(screen==='positive')return renderFuture(content,footer,'pos');if(screen==='comparison')return renderComparison(content,footer);if(screen==='actions')return renderActions(content,footer);if(screen==='summary')return renderSummary(content,footer);if(screen==='survey')return renderSurvey(content,footer);if(screen==='externalInfo')return renderExternalInfo(content,footer)}
function renderSplash(content,footer){content.innerHTML=`<div class="screen splash-screen"><div class="splash-art"><div class="moon"></div><div class="silhouette"><div class="figure"></div><div class="figure small"></div><div class="figure" style="height:48px"></div></div></div><h1 class="title">あなたの選択が、<br>未来の家族をつくる。</h1><p class="lead">将来の自分と家族の姿を、12の質問でシミュレーションしてみましょう。育児に関わるかどうかで、10年後の家族はどう変わる？</p></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">はじめる</button><div class="quick-links icon-links"><button class="quick-link icon-link" onclick="go('survey')"><span class="quick-icon">📝</span><small>アンケート</small></button><button class="quick-link icon-link" onclick="go('externalInfo')"><span class="quick-icon external-box">↗</span><small>情報</small></button></div>`}
function renderOpening(content,footer){content.innerHTML=`<div class="screen"><div class="eyebrow">Prologue</div><h1 class="title">これは、あなたが<br>\"父になった未来\"の物語。</h1><p class="lead">さあ、未来の家族のために、<br>今のあなたの考えを教えてください。</p><p class="lead" style="margin-top:18px;">所要時間は、およそ2分です。質問は12個。正解はありません、思った通りに答えてみてください。</p></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">質問にこたえる</button>`}
function renderQuiz(content,footer){const q=QUESTIONS[state.qIndex],cat=CATS[q.cat],pct=Math.round(state.qIndex/QUESTIONS.length*100);content.innerHTML=`<div class="screen"><div class="qprog-track"><div class="qprog-fill" style="width:${pct}%"></div></div><div class="qcount"><span class="qcat">${ICONS[cat.icon]} ${cat.label}</span><span>${state.qIndex+1} / ${QUESTIONS.length}</span></div><div class="qtext">${q.text}</div><div id="optWrap">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.l}</button>`).join('')}</div></div>`;content.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{content.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const i=parseInt(btn.dataset.i,10),o=q.opts[i];setTimeout(()=>{state.answers[state.qIndex]={cat:q.cat,s:o.s};if(state.qIndex<QUESTIONS.length-1){state.qIndex++;renderQuiz(content,footer)}else go('result')},280)}));footer.innerHTML=`<button class="btn-ghost" id="skipLink">あとで続ける（残りはスキップ）</button>`;document.getElementById('skipLink').addEventListener('click',()=>{for(let i=state.qIndex;i<QUESTIONS.length;i++)if(!state.answers[i])state.answers[i]={cat:QUESTIONS[i].cat,s:6};go('result')})}
function renderResult(content,footer){const pct=totalScorePct(),type=getType(pct);content.innerHTML=`<div class="screen"><div class="eyebrow">診断結果</div><h1 class="title">あなたの父親タイプは…</h1><div class="result-card"><div class="type-name">${type.name}</div><div><span class="score-num" id="scoreNum">0</span><span class="score-unit"> / 100点</span></div><div class="score-bar-track"><div class="score-bar-fill" id="scoreBar" style="width:0%"></div></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--cream-dim);margin-top:4px;">育児参加意識スコア</div></div><div class="desc-box">${type.desc}</div></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">10年後の未来を見る</button>`;const numEl=document.getElementById('scoreNum'),barEl=document.getElementById('scoreBar');let cur=0;const step=Math.max(1,Math.round(pct/30));const timer=setInterval(()=>{cur+=step;if(cur>=pct){cur=pct;clearInterval(timer)}numEl.textContent=cur;barEl.style.width=cur+'%'},20)}
function renderFuture(content,footer,mode){const pct=totalScorePct(),type=getType(pct),isNeg=mode==='neg',heading=isNeg?`このまま「${type.name}」のまま、何も変えなければ…`:`もし、積極的に育児へ参加したら…`,sub=isNeg?'10年後の、何も変わらなかったあなた':'10年後の、変わろうとしたあなた';content.innerHTML=`<div class="screen"><div class="future-head"><span class="future-tag ${isNeg?'neg':'pos'}">${isNeg?'NEGATIVE FUTURE':'POSITIVE FUTURE'}</span></div><h1 class="title" style="font-size:21px;">${heading}</h1><p class="lead" style="margin-bottom:18px;">${sub}</p>${Object.keys(CATS).map(k=>`<div class="row ${isNeg?'neg':'pos'}"><div class="ico">${ICONS[CATS[k].icon]}</div><div><div class="label">${CATS[k].label}</div><div class="val">${isNeg?ROWS[k].neg:ROWS[k].pos}</div></div></div>`).join('')}<div class="quote-card"><div class="quote-who">10年後の子どもより</div><div class="quote-text">${isNeg?MESSAGES.neg.child:MESSAGES.pos.child}</div></div><div class="quote-card"><div class="quote-who">10年後のパートナーより</div><div class="quote-text">${isNeg?MESSAGES.neg.partner:MESSAGES.pos.partner}</div></div></div>`;footer.innerHTML=isNeg?`<button class="btn btn-primary" onclick="next()">もし、変わったら？</button>`:`<button class="btn btn-primary" onclick="next()">2つの未来を比較する</button>`}
function renderComparison(content,footer){content.innerHTML=`<div class="screen"><div class="eyebrow">Two Futures</div><h1 class="title" style="font-size:21px;">未来は、ここで分かれる。</h1><div class="road-wrap"><svg id="roadSvg" viewBox="0 0 320 200" width="100%" height="190"><circle cx="160" cy="22" r="6" fill="#E8B86D"/><text x="160" y="14" text-anchor="middle" fill="#C9C2B2" font-size="10" font-family="JetBrains Mono">今のあなた</text><path id="pathNeg" d="M160 26 C 110 70, 70 100, 40 175" stroke="#8089A0" stroke-width="4" fill="none" stroke-linecap="round"/><path id="pathPos" d="M160 26 C 210 70, 250 100, 280 175" stroke="#E8B86D" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="40" cy="178" r="7" fill="#8089A0"/><circle cx="280" cy="178" r="7" fill="#E8B86D"/><text x="40" y="195" text-anchor="middle" fill="#8089A0" font-size="9.5" font-family="Zen Kaku Gothic New">変わらない未来</text><text x="280" y="195" text-anchor="middle" fill="#E8B86D" font-size="9.5" font-family="Zen Kaku Gothic New">変わる未来</text></svg></div><div class="compare-cols"><div class="col neg"><h3>現在のままの未来</h3>${Object.keys(CATS).map(k=>`<div class="mini-row"><span class="mini-cat">${CATS[k].label}</span>${ROWS[k].neg}</div>`).join('')}</div><div class="col pos"><h3>育児に参加した未来</h3>${Object.keys(CATS).map(k=>`<div class="mini-row"><span class="mini-cat">${CATS[k].label}</span>${ROWS[k].pos}</div>`).join('')}</div></div></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">今からできることを見る</button>`;requestAnimationFrame(()=>['pathNeg','pathPos'].forEach(id=>{const p=document.getElementById(id);if(!p)return;const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.style.transition='stroke-dashoffset 1s ease';requestAnimationFrame(()=>{p.style.strokeDashoffset=0})}))}
function renderActions(content,footer){const order=weakestOrder(),top=order[0],rest=order.slice(1);content.innerHTML=`<div class="screen"><div class="eyebrow">Action Plan</div><h1 class="title" style="font-size:21px;">未来は、今日からの一歩で変わる。</h1><div class="action-priority"><div class="eyebrow">まず意識したいこと（${CATS[top].label}）</div><div class="atext">${ACTIONS[top]}</div></div><div>${rest.map((k,i)=>`<div class="action-item"><span class="num">0${i+2}</span><span>${ACTIONS[k]}</span></div>`).join('')}</div></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">まとめを見る</button>`}
function renderSummary(content,footer){const pct=totalScorePct(),type=getType(pct);content.innerHTML=`<div class="screen"><div class="summary-art"><div class="sun"></div><div class="silhouette"><div class="figure" style="height:46px"></div><div class="figure small"></div><div class="figure" style="height:46px"></div></div></div><h1 class="title" style="font-size:22px;">未来は、<br>あなたの選択で変えられる。</h1><p class="lead">小さな一歩が、10年後の家族の笑顔につながります。</p><div class="recap"><div><div class="label" style="font-family:var(--font-mono);font-size:11px;color:var(--cream-dim);">診断タイプ</div><div class="rtype">${type.name}</div></div><div class="rscore">${pct}<span style="font-size:12px;color:var(--cream-dim);">/100</span></div></div><p class="credit-note">この体験はあくまでシミュレーションです。実際の家族のかたちに、決まった正解はありません。</p></div>`;footer.innerHTML=`<button class="btn btn-secondary" onclick="restart()">終了</button>`}
function renderSurvey(content,footer){content.innerHTML=`<div class="screen survey-screen"><h1 class="title" style="font-size:22px;">アンケート</h1><div class="survey-list"><section class="survey-q"><div class="survey-no">Q1</div><h2>性別を教えてください。</h2><div class="survey-options">${['男性','女性','回答しない'].map(v=>`<label><input type="radio" name="q1" value="${v}"><span>${v}</span></label>`).join('')}</div></section><section class="survey-q"><div class="survey-no">Q2</div><h2>現在のご自身に最も近いものを選んでください。</h2><div class="survey-options">${['パパ・ママ','これからなる可能性が少しでもある','その他'].map(v=>`<label><input type="radio" name="q2" value="${v}"><span>${v}</span></label>`).join('')}</div></section><section class="survey-q"><div class="survey-no">Q3</div><h2>【診断前】自分が将来（あるいは今）育児をすることについて、関心がある。</h2>${surveyScale('q3_before')}</section><section class="survey-q"><div class="survey-no">Q4</div><h2>【診断後】自分が将来（あるいは今）育児をすることについて、関心がある。</h2>${surveyScale('q3_after')}</section><section class="survey-q"><div class="survey-no">Q5</div><h2>【診断前】育児とは具体的にどのようなことをするのか、理解している。</h2>${surveyScale('q4_before')}</section><section class="survey-q"><div class="survey-no">Q6</div><h2>【診断後】育児とは具体的にどのようなことをするのか、理解している。</h2>${surveyScale('q4_after')}</section><section class="survey-q"><div class="survey-no">Q7</div><h2>【診断前】育児は「自分にも関係のあること」だと感じている。</h2>${surveyScale('q5_before')}</section><section class="survey-q"><div class="survey-no">Q8</div><h2>【診断後】育児は「自分にも関係のあること」だと感じている。</h2>${surveyScale('q5_after')}</section></div></div>`;footer.innerHTML=`<button class="survey-back" onclick="go('splash')">←</button><button class="btn btn-primary survey-submit" onclick="submitSurvey()">送信</button>`}
function surveyScale(name){return `<div class="survey-scale"><div class="survey-scale-label"><span>まったくそう思わない</span><span>とてもそう思う</span></div><div class="survey-scale-buttons">${Array.from({length:10},(_,i)=>`<label><input type="radio" name="${name}" value="${i+1}"><span>${i+1}</span></label>`).join('')}</div></div>`}
function submitSurvey(){const required=['q1','q2','q3_before','q3_after','q4_before','q4_after','q5_before','q5_after'];if(!required.every(name=>document.querySelector(`input[name="${name}"]:checked`))){alert('すべての質問に回答してください。');return}go('splash')}
const INFO_ITEMS=[{name:'Zaim',category:'お金',type:'家計管理',desc:'家計簿・支出管理をまとめて確認できるサービス。',url:'https://zaim.net/'},{name:'マネーフォワード ME',category:'お金',type:'家計管理',desc:'家計簿・資産管理をまとめて管理できるサービス。',url:'https://moneyforward.com/me'},{name:'TimeTree',category:'時間・仕事',type:'スケジュール',desc:'家族やパートナーと予定を共有できるカレンダー。',url:'https://timetreeapp.com/'},{name:'Famm',category:'家族・記録',type:'家族写真',desc:'家族の写真や子どもの成長を記録・共有できるサービス。',url:'https://famm.us/ja/'},{name:'家族アルバム みてね',category:'家族・記録',type:'家族写真',desc:'子どもの写真・動画を家族で共有できるサービス。',url:'https://mitene.us/'},{name:'BABY365',category:'家族・記録',type:'育児記録',desc:'子どもの成長や日々の出来事を記録できるアプリ。',url:'https://baby365.jp/'},{name:'トツキトオカ',category:'妊娠・育児',type:'妊娠・出産',desc:'妊娠中の体調や赤ちゃんの成長を記録できるアプリ。',url:'https://www.totsukitoka-apps.com/'},{name:'ぴよログ',category:'妊娠・育児',type:'育児記録',desc:'授乳・睡眠・排泄など赤ちゃんのお世話を記録できるアプリ。',url:'https://www.piyolog.com/'},{name:'ママリ',category:'妊娠・育児',type:'情報・相談',desc:'妊娠・出産・子育てについて情報交換や相談ができるサービス。',url:'https://mamari.jp/'},{name:'ルナルナ',category:'妊娠・育児',type:'女性の健康',desc:'生理・妊娠など女性の健康をサポートするサービス。',url:'https://sp.lnln.jp/'},{name:'こども家庭庁',category:'妊娠・育児',type:'行政',desc:'こども・子育てに関する制度や施策などの公式情報。',url:'https://www.cfa.go.jp/'},{name:'厚生労働省',category:'時間・仕事',type:'行政',desc:'育児休業や仕事と子育ての両立に関する公式情報。',url:'https://www.mhlw.go.jp/'},{name:'共育プロジェクト',category:'時間・仕事',type:'行政',desc:'仕事と育児の両立や男性の育児参加に関する情報。',url:'https://www.mhlw.go.jp/'}];
const INFO_CATEGORIES=['すべて','お金','時間・仕事','妊娠・育児','家族・記録'];let infoFilter='すべて',matrixScale=1,matrixX=0,matrixY=0,matrixDrag=null;
function renderExternalInfo(content,footer){content.innerHTML=`<div class="screen external-screen"><div class="eyebrow">External Information</div><h1 class="title" style="font-size:22px;">外部情報</h1><p class="lead">育児や生活に役立つサービス・情報を、テーマごとにまとめています。</p><div class="info-tools"><div class="info-filters">${INFO_CATEGORIES.map(c=>`<button class="info-filter ${infoFilter===c?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div></div><div class="matrix-wrap" id="matrixWrap"><div class="matrix-canvas" id="matrixCanvas"><div class="matrix-grid"><div class="matrix-quadrant"><strong>お金</strong><span>家計・資産を整える</span></div><div class="matrix-quadrant"><strong>時間・仕事</strong><span>予定・働き方を整える</span></div><div class="matrix-quadrant"><strong>家族・記録</strong><span>家族の共有・記録</span></div><div class="matrix-quadrant"><strong>妊娠・育児</strong><span>妊娠・出産・子育て</span></div>${INFO_ITEMS.map((item,i)=>{const pos=[['24','26'],['72','24'],['28','76'],['72','74'],['43','82'],['82','56'],['56','24'],['63','68'],['86','30'],['38','45'],['60','42'],['76','46'],['68','84']][i];return `<button class="matrix-point" data-label="${item.name}" data-cat="${item.category}" style="left:${pos[0]}%;top:${pos[1]}%" aria-label="${item.name}"></button>`}).join('')}</div></div><div class="matrix-axis-x">家族・生活とのつながり →</div><div class="matrix-axis-y">サポートの必要度</div><div class="matrix-controls"><button id="matrixMinus" aria-label="縮小">−</button><button id="matrixReset" aria-label="リセット">↺</button><button id="matrixPlus" aria-label="拡大">＋</button></div></div><div class="matrix-hint">指でドラッグして移動 ／ ピンチで拡大・縮小</div><div class="info-section-title">INFORMATION LIST</div><div class="info-list" id="infoList"></div></div>`;const wrap=document.getElementById('matrixWrap'),canvas=document.getElementById('matrixCanvas');const applyTransform=()=>{canvas.style.transform=`translate(${matrixX}px,${matrixY}px) scale(${matrixScale})`};const zoomAt=(delta,cx=wrap.clientWidth/2,cy=wrap.clientHeight/2)=>{const old=matrixScale;matrixScale=Math.max(.65,Math.min(2.3,matrixScale+delta));const ratio=matrixScale/old;matrixX=cx-(cx-matrixX)*ratio;matrixY=cy-(cy-matrixY)*ratio;applyTransform()};document.getElementById('matrixMinus').onclick=()=>zoomAt(-.15);document.getElementById('matrixPlus').onclick=()=>zoomAt(.15);document.getElementById('matrixReset').onclick=()=>{matrixScale=1;matrixX=0;matrixY=0;applyTransform()};wrap.onpointerdown=e=>{if(e.target.closest&&e.target.closest('.matrix-point, .matrix-controls'))return;wrap.classList.add('dragging');wrap.setPointerCapture(e.pointerId);matrixDrag={x:e.clientX,y:e.clientY,mx:matrixX,my:matrixY}};wrap.onpointermove=e=>{if(!matrixDrag)return;matrixX=matrixDrag.mx+e.clientX-matrixDrag.x;matrixY=matrixDrag.my+e.clientY-matrixDrag.y;applyTransform()};wrap.onpointerup=wrap.onpointercancel=()=>{matrixDrag=null;wrap.classList.remove('dragging')};let pinchStart=null;wrap.ontouchstart=e=>{if(e.touches.length===2){pinchStart={dist:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),scale:matrixScale}}};wrap.ontouchmove=e=>{if(e.touches.length===2&&pinchStart){e.preventDefault();const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);matrixScale=Math.max(.65,Math.min(2.3,pinchStart.scale*(dist/pinchStart.dist)));applyTransform()}};content.querySelectorAll('.info-filter').forEach(b=>b.onclick=()=>{infoFilter=b.dataset.filter;renderExternalInfo(content,footer)});content.querySelectorAll('.matrix-point').forEach((p,i)=>p.onclick=e=>{e.preventDefault();e.stopPropagation();const item=INFO_ITEMS[i];if(window.__showExternalConfirm)window.__showExternalConfirm(item.url,item.name);});const list=document.getElementById('infoList');const filtered=infoFilter==='すべて'?INFO_ITEMS:INFO_ITEMS.filter(x=>x.category===infoFilter);list.innerHTML=filtered.map(item=>`<a class="info-item" href="${item.url}" target="_blank" rel="noopener noreferrer"><span class="info-site-icon"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(new URL(item.url).hostname)}&sz=64" alt=""></span><div class="info-title">${item.name}</div><div class="info-desc">${item.desc}</div><div class="info-meta"><span class="info-tag">${item.category}</span><span class="info-tag">${item.type}</span></div></a>`).join('');applyTransform()}
document.getElementById('brandHome').addEventListener('click',restart);document.getElementById('helpBtn').addEventListener('click',()=>document.getElementById('modalOverlay').classList.add('show'));document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modalOverlay').classList.remove('show'));render();
</script>
<script>/* unified-external-confirmation-20260906 */
(function(){
  var nativeOpen=window.open.bind(window);
  var pendingUrl=null;
  var overlay=document.createElement('div');
  overlay.id='externalConfirmOverlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(7,10,16,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-sizing:border-box';
  var box=document.createElement('div');
  box.style.cssText='width:min(310px,100%);box-sizing:border-box;padding:22px;border:1px solid var(--border);border-radius:16px;background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.35)';
  box.innerHTML='<div style="font:9px var(--font-mono);letter-spacing:.12em;color:var(--gold-dim);margin-bottom:8px">EXTERNAL SITE</div><div id="externalConfirmName" style="font:18px var(--font-body);font-weight:600;color:var(--cream);margin-bottom:10px"></div><div style="font:12px var(--font-body);line-height:1.7;color:var(--cream-dim);margin-bottom:18px">外部サイトを開きます。<br>サイトを移動してもよろしいですか？</div><div style="display:flex;gap:8px"><button id="externalConfirmCancel" type="button" style="flex:1;height:34px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--cream-dim);font:11px var(--font-body);cursor:pointer">閉じる</button><button id="externalConfirmOpen" type="button" style="flex:1;height:34px;border:1px solid var(--gold);border-radius:9px;background:var(--gold-dim);color:var(--cream);font:11px var(--font-body);cursor:pointer">開く</button></div>';
  overlay.appendChild(box);document.body.appendChild(overlay);
  function close(){pendingUrl=null;overlay.style.display='none'}
  function show(url,name){if(!url)return;pendingUrl=url;document.getElementById('externalConfirmName').textContent=name||'外部サイト';overlay.style.display='flex'}
    window.__showExternalConfirm=show;
  document.getElementById('externalConfirmCancel').addEventListener('click',close);
  document.getElementById('externalConfirmOpen').addEventListener('click',function(){var url=pendingUrl;close();if(url)nativeOpen(url,'_blank','noopener,noreferrer')});
  overlay.addEventListener('click',function(e){if(e.target===overlay)close()});
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a.info-item');if(!a)return;e.preventDefault();e.stopImmediatePropagation();show(a.href,(a.querySelector('.info-title')||a).textContent.trim())},true);
  window.open=function(url,target,features){show(String(url||''),'外部サイト');return null};
})();
</script>
