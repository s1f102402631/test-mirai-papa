<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>みらいパパ ― 未来の育児シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141B2B;
    --panel:#1F2A40;
    --panel-light:#2B3A57;
    --panel-soft:#34456A;
    --cream:#F6EFE2;
    --cream-dim:#C9C2B2;
    --gold:#E8B86D;
    --gold-dim:#9C8A60;
    --coral:#F09A66;
    --coral-soft:#3A2C28;
    --slate:#8089A0;
    --slate-soft:#2A3142;
    --border:rgba(246,239,226,0.10);
    --font-display:'Shippori Mincho',serif;
    --font-body:'Zen Kaku Gothic New',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-body);
    color:var(--cream);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(1200px 700px at 18% -10%, #2C3E63 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 100%, #1A2336 0%, transparent 55%),
      linear-gradient(160deg, #0F1422 0%, #161F33 45%, #1D2A45 100%);
    overflow:hidden;
    position:relative;
  }
  .stars{
    position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.55) 0, transparent 40%),
      radial-gradient(1.5px 1.5px at 80% 10%, rgba(255,255,255,.4) 0, transparent 40%),
      radial-gradient(2px 2px at 60% 35%, rgba(255,255,255,.5) 0, transparent 40%),
      radial-gradient(1.5px 1.5px at 30% 60%, rgba(255,255,255,.35) 0, transparent 40%),
      radial-gradient(2px 2px at 90% 70%, rgba(255,255,255,.45) 0, transparent 40%),
      radial-gradient(1.5px 1.5px at 45% 85%, rgba(255,255,255,.3) 0, transparent 40%),
      radial-gradient(1.5px 1.5px at 15% 90%, rgba(255,255,255,.35) 0, transparent 40%);
    background-size:100% 100%;
    animation:twinkle 4.5s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.5}to{opacity:1}}

  .phone{
    width:min(430px, 94vw);
    height:min(880px, 94vh);
    background:var(--panel);
    border-radius:38px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 8px rgba(255,255,255,0.02);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    z-index:1;
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px 12px;
    flex-shrink:0;
  }
  .brand{
    font-family:var(--font-display);
    font-size:15px; letter-spacing:.06em; color:var(--gold);
  }
  .dots{display:flex; gap:5px;}
  .dot{width:6px; height:6px; border-radius:50%; background:rgba(246,239,226,.18); transition:background .3s, transform .3s;}
  .dot.done{background:var(--coral);}
  .dot.active{background:var(--gold); transform:scale(1.35);}
  .help-btn{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--border);
    background:transparent; color:var(--cream-dim); font-family:var(--font-mono);
    font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .help-btn:hover{border-color:var(--gold); color:var(--gold);}

  .content{
    flex:1; overflow-y:auto; padding:8px 24px 18px;
    scrollbar-width:thin;
  }
  .content::-webkit-scrollbar{width:4px;}
  .content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15); border-radius:4px;}

  .screen{animation:riseIn .45s ease both;}
  @keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .screen{animation:none;}
    *{transition:none !important; animation-duration:.01ms !important;}
  }

  .footer{
    padding:14px 22px 24px;
    border-top:1px solid var(--border);
    flex-shrink:0;
    display:flex; flex-direction:column; gap:10px;
  }

  .btn{
    width:100%; border:none; border-radius:15px; padding:16px;
    font-family:var(--font-body); font-weight:700; font-size:15.5px;
    cursor:pointer; letter-spacing:.02em; transition:transform .15s, filter .15s;
  }
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn-primary{background:linear-gradient(135deg, var(--gold), #D9A24F); color:#241A09;}
  .btn-primary:hover{filter:brightness(1.08); transform:translateY(-2px);}
  .btn-secondary{background:transparent; border:1px solid var(--border); color:var(--cream);}
  .btn-secondary:hover{border-color:var(--gold); color:var(--gold);}
  .btn-ghost{
    background:none; border:none; color:var(--cream-dim); text-decoration:underline;
    font-size:12.5px; cursor:pointer; align-self:center; font-family:var(--font-body);
  }
  .btn-ghost:hover{color:var(--gold);}

  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; color:var(--gold-dim);
    text-transform:uppercase; margin-bottom:10px;
  }
  h1.title{
    font-family:var(--font-display); font-size:25px; line-height:1.5; font-weight:500;
    margin-bottom:10px; color:var(--cream);
  }
  p.lead{font-size:14.5px; line-height:1.85; color:var(--cream-dim); margin-bottom:6px;}

  /* splash */
  .splash-art{
    height:200px; border-radius:20px; margin:6px 0 22px;
    background:linear-gradient(180deg, #2E3E63 0%, #1A2236 70%, #11162420 100%);
    position:relative; overflow:hidden; border:1px solid var(--border);
  }
  .splash-art::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:60%;
    background:linear-gradient(0deg, rgba(20,27,43,.95), transparent);
  }
  .silhouette{position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:2;}
  .figure{width:18px; height:54px; background:#0E1422; border-radius:9px 9px 4px 4px;}
  .figure.small{width:12px; height:34px; align-self:flex-end;}
  .moon{position:absolute; top:18px; right:24px; width:34px; height:34px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #FFF6DE, var(--gold) 70%); box-shadow:0 0 26px rgba(232,184,109,.5);}

  /* quiz */
  .qprog-track{height:5px; border-radius:4px; background:var(--slate-soft); margin-bottom:18px; overflow:hidden;}
  .qprog-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--coral)); border-radius:4px; transition:width .4s ease;}
  .qcount{font-family:var(--font-mono); font-size:12px; color:var(--cream-dim); margin-bottom:14px; display:flex; justify-content:space-between;}
  .qcat{display:inline-flex; align-items:center; gap:6px; color:var(--gold); font-size:12px; font-family:var(--font-mono);}
  .qcat svg{width:14px; height:14px;}
  .qtext{font-family:var(--font-display); font-size:19px; line-height:1.6; margin:14px 0 22px; color:var(--cream);}
  .opt{
    display:block; width:100%; text-align:left; padding:16px 18px; margin-bottom:11px;
    border-radius:14px; background:var(--panel-light); border:1px solid var(--border);
    color:var(--cream); font-family:var(--font-body); font-size:14.5px; cursor:pointer;
    transition:border-color .2s, background .2s, transform .15s;
  }
  .opt:hover{border-color:var(--gold); transform:translateX(2px);}
  .opt.selected{background:var(--gold); color:#241A09; border-color:var(--gold); font-weight:700;}

  /* result */
  .result-card{
    background:var(--panel-light); border:1px solid var(--border); border-radius:20px;
    padding:26px 22px; text-align:center; margin-bottom:18px;
  }
  .type-name{font-family:var(--font-display); font-size:28px; color:var(--gold); margin:6px 0 14px;}
  .score-num{font-family:var(--font-mono); font-size:46px; font-weight:700; color:var(--cream);}
  .score-unit{font-family:var(--font-mono); font-size:15px; color:var(--cream-dim);}
  .score-bar-track{height:8px; border-radius:6px; background:var(--slate-soft); margin:16px 0 4px; overflow:hidden;}
  .score-bar-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--slate),var(--gold));}
  .desc-box{
    background:var(--panel-soft); border-radius:14px; padding:16px 16px; font-size:13.5px;
    line-height:1.8; color:var(--cream-dim); border:1px solid var(--border);
  }

  /* future rows */
  .future-head{display:flex; align-items:center; gap:10px; margin:18px 0 16px;}
  .future-tag{
    font-family:var(--font-mono); font-size:11px; padding:4px 10px; border-radius:20px;
    letter-spacing:.06em;
  }
  .future-tag.neg{background:rgba(128,137,160,.18); color:var(--slate);}
  .future-tag.pos{background:rgba(232,184,109,.18); color:var(--gold);}
  .row{
    display:flex; align-items:center; gap:14px; padding:14px 14px;
    border-radius:14px; margin-bottom:10px; border:1px solid var(--border);
  }
  .row.neg{background:var(--slate-soft);}
  .row.pos{background:var(--coral-soft);}
  .row .ico{
    width:38px; height:38px; flex-shrink:0; border-radius:11px; display:flex; align-items:center; justify-content:center;
  }
  .row.neg .ico{background:rgba(128,137,160,.18); color:var(--slate);}
  .row.pos .ico{background:rgba(240,154,102,.2); color:var(--coral);}
  .row .ico svg{width:19px; height:19px;}
  .row .label{font-size:11.5px; color:var(--cream-dim); margin-bottom:2px; font-family:var(--font-mono); letter-spacing:.02em;}
  .row .val{font-size:14.5px; font-weight:700;}
  .row.neg .val{color:#C7CCDA;}
  .row.pos .val{color:#FFD8B0;}

  .quote-card{
    margin-top:18px; padding:16px 18px; border-radius:16px; position:relative;
    border:1px solid var(--border); background:var(--panel-soft);
  }
  .quote-who{font-family:var(--font-mono); font-size:11px; color:var(--gold-dim); margin-bottom:8px; letter-spacing:.05em;}
  .quote-text{font-family:var(--font-display); font-size:14.5px; line-height:1.85; color:var(--cream);}
  .quote-text::before{content:'“'; color:var(--gold-dim); font-size:20px;}

  /* comparison */
  .road-wrap{
    background:var(--panel-light); border-radius:18px; padding:14px 6px 4px; margin-bottom:18px;
    border:1px solid var(--border);
  }
  .compare-cols{display:flex; gap:10px; margin-top:14px;}
  .col{flex:1; border-radius:16px; padding:14px 12px; border:1px solid var(--border);}
  .col.neg{background:var(--slate-soft);}
  .col.pos{background:var(--coral-soft);}
  .col h3{font-size:12.5px; font-family:var(--font-mono); margin-bottom:12px; letter-spacing:.02em;}
  .col.neg h3{color:var(--slate);}
  .col.pos h3{color:var(--coral);}
  .col .mini-row{font-size:12.5px; line-height:1.7; margin-bottom:9px; padding-left:14px; position:relative;}
  .col.neg .mini-row::before{content:'−'; position:absolute; left:0; color:var(--slate);}
  .col.pos .mini-row::before{content:'+'; position:absolute; left:0; color:var(--coral);}
  .col .mini-cat{display:block; color:var(--cream-dim); font-size:10.5px; font-family:var(--font-mono);}

  /* actions */
  .action-priority{
    background:linear-gradient(135deg, rgba(232,184,109,.16), rgba(240,154,102,.10));
    border:1px solid rgba(232,184,109,.35); border-radius:16px; padding:18px;
    margin-bottom:16px;
  }
  .action-priority .eyebrow{color:var(--gold); margin-bottom:8px;}
  .action-priority .atext{font-family:var(--font-display); font-size:16.5px; line-height:1.7; color:var(--cream);}
  .action-item{
    display:flex; gap:12px; align-items:flex-start; padding:13px 0;
    border-bottom:1px solid var(--border); font-size:13.5px; line-height:1.7; color:var(--cream-dim);
  }
  .action-item:last-child{border-bottom:none;}
  .action-item .num{font-family:var(--font-mono); color:var(--gold-dim); font-size:12px; flex-shrink:0; padding-top:2px;}

  /* summary */
  .summary-art{
    height:170px; border-radius:18px; margin-bottom:20px; position:relative; overflow:hidden;
    background:linear-gradient(180deg, #4A3A2C 0%, #B97A4A 45%, #E8B86D 100%);
    border:1px solid var(--border);
  }
  .sun{position:absolute; bottom:30px; left:50%; transform:translateX(-50%); width:70px; height:70px; border-radius:50%; background:#FFF1D6; box-shadow:0 0 50px rgba(255,241,214,.7);}
  .summary-art .silhouette .figure{background:#241A1080;}
  .recap{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel-light); border-radius:16px; padding:16px 18px; margin-bottom:16px;
    border:1px solid var(--border);
  }
  .recap .rtype{font-family:var(--font-display); font-size:16px; color:var(--gold);}
  .recap .rscore{font-family:var(--font-mono); font-size:20px;}
  .credit-note{font-size:12px; color:var(--cream-dim); line-height:1.8; text-align:center; margin-top:6px;}

  /* modal */
  .modal-overlay{
    position:absolute; inset:0; background:rgba(10,13,22,.78); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:30px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--panel-light); border:1px solid var(--border); border-radius:18px;
    padding:24px; max-width:320px;
  }
  .modal-box h2{font-family:var(--font-display); font-size:18px; margin-bottom:12px; color:var(--gold);}
  .modal-box p{font-size:13px; line-height:1.85; color:var(--cream-dim); margin-bottom:14px;}
  .modal-box .btn{margin-top:4px;}
</style>
</head>
<body>
<div class="stars"></div>
<div class="phone">
  <div class="topbar">
    <span class="brand">みらいパパ</span>
    <div class="dots" id="dots"></div>
    <button class="help-btn" id="helpBtn" aria-label="ヘルプ">?</button>
  </div>
  <div class="content" id="content"></div>
  <div class="footer" id="footer"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2>このアプリについて</h2>
    <p>「みらいパパ」は、将来父親になるかもしれないあなたが、育児への向き合い方によって変わる10年後の家族の姿を疑似体験できるシミュレーターです。12個の質問に答えると、あなたの今の意識タイプと、2つの未来（育児に関わらなかった場合／積極的に関わった場合）が表示されます。</p>
    <p>結果に正解・不正解はありません。未来は、これからのあなたの選択次第で変えられます。</p>
    <button class="btn btn-primary" id="modalClose">閉じる</button>
  </div>
</div>

<script>
/* ---------------- Data ---------------- */
const ICONS = {
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.8-9.4C.8 7.7 2.4 4.5 5.6 4c2-.3 3.7.6 4.9 2.1L12 7.6l1.5-1.5c1.2-1.5 2.9-2.4 4.9-2.1 3.2.5 4.8 3.7 3.4 7.1-2.3 4.8-9.8 9.4-9.8 9.4z"/></svg>',
  child: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3.2"/><path d="M6 21v-3.5C6 14.5 8.5 13 12 13s6 1.5 6 4.5V21"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg>'
};

const CATS = {
  wife:   {label:'妻との関係',     icon:'heart'},
  child:  {label:'子どもとの関係', icon:'child'},
  time:   {label:'家族時間',       icon:'clock'},
  growth: {label:'育児への意識',   icon:'book'}
};

const ROWS = {
  wife:   {neg:'すれ違いが増えている',           pos:'信頼し合えるパートナーに'},
  child:  {neg:'会話が少ない',                   pos:'何でも話せる関係に'},
  time:   {neg:'週に1時間未満',                  pos:'週に10時間以上'},
  growth: {neg:'育児への関心が薄れている',       pos:'学び続け、頼れる存在に'}
};

const ACTIONS = {
  wife:   'パートナーの話を、最後まで聞く時間をつくる',
  child:  '子どもの行事や送り迎えに、月1回からでも参加してみる',
  time:   '育休制度について、今のうちに調べておく',
  growth: '育児の本やSNSで、先輩パパの体験談を読んでみる'
};

const MESSAGES = {
  neg:{ child:'お父さんとはあまり話さなかったな…。でも、今は別に困ってないよ。',
        partner:'ずっと一人で育児を頑張ってきました。正直、もっと一緒に悩んでほしかった。' },
  pos:{ child:'お父さんがいつも話を聞いてくれたから、今でも何でも相談できるよ。ありがとう。',
        partner:'一緒に育児を頑張ってくれて、本当に助かりました。あなたのおかげで今の私たちがあります。' }
};

const QUESTIONS = [
  {cat:'wife',   text:'家事や育児の分担について、どう考えますか？',
    opts:[{l:'できる限り半分ずつ担いたい',s:10},{l:'状況に応じて柔軟に分担したい',s:6},{l:'得意な方が多く担当すればいい',s:2}]},
  {cat:'child',  text:'子どもの送り迎えや習い事の付き添いは？',
    opts:[{l:'自分も積極的に担当したい',s:10},{l:'パートナーと交代でやりたい',s:6},{l:'基本的にはパートナーに任せたい',s:2}]},
  {cat:'time',   text:'休日の過ごし方は、どちらに近いですか？',
    opts:[{l:'家族との時間を最優先にしたい',s:10},{l:'家族と自分の時間を半々にしたい',s:6},{l:'自分の時間も大切にしたい',s:2}]},
  {cat:'growth', text:'育児に関する知識や情報を学ぶことについて',
    opts:[{l:'積極的に学びたい',s:10},{l:'必要になったら学べばいい',s:6},{l:'パートナーに任せておけば十分',s:2}]},
  {cat:'wife',   text:'共働きについて、どう考えますか？',
    opts:[{l:'積極的にしたい',s:10},{l:'どちらでもよい',s:6},{l:'したくない',s:2}]},
  {cat:'child',  text:'子どもの夜泣きや夜間の対応について',
    opts:[{l:'自分も交代で対応したい',s:10},{l:'余裕があるときは対応したい',s:6},{l:'基本はパートナーに任せたい',s:2}]},
  {cat:'time',   text:'育児休業の取得について、どう思いますか？',
    opts:[{l:'できるだけ長く取りたい',s:10},{l:'短期間でも取りたい',s:6},{l:'取らなくてもいいと思う',s:2}]},
  {cat:'growth', text:'自分のキャリアと育児のバランスについて',
    opts:[{l:'育児のために働き方を見直したい',s:10},{l:'状況によって調整したい',s:6},{l:'キャリアを優先したい',s:2}]},
  {cat:'wife',   text:'パートナーが悩みや不満を話してきたとき',
    opts:[{l:'じっくり話を聞き、一緒に考えたい',s:10},{l:'時間があれば聞きたい',s:6},{l:'あまり深く関わりたくない',s:2}]},
  {cat:'child',  text:'子どもの行事（運動会・発表会など）について',
    opts:[{l:'必ず参加したい',s:10},{l:'できる範囲で参加したい',s:6},{l:'仕事が優先になると思う',s:2}]},
  {cat:'time',   text:'子どもとの時間を確保するために',
    opts:[{l:'仕事を調整してでも時間を作りたい',s:10},{l:'余った時間でなるべく作りたい',s:6},{l:'特に意識していない',s:2}]},
  {cat:'growth', text:'将来、子どもにとってどんな存在でいたいですか？',
    opts:[{l:'何でも話せる、頼れる存在でいたい',s:10},{l:'必要なときに頼れる存在でいい',s:6},{l:'あまり意識していない',s:2}]}
];

const TYPES = [
  {max:30,  name:'仕事優先型', desc:'仕事に全力を注ぐ姿勢は、それ自体は立派なことです。ただ、このままでは育児や家庭との時間が後回しになりがち。少しずつ、家庭にも目を向けるバランスを意識してみましょう。'},
  {max:55,  name:'バランス型', desc:'仕事と家庭、両方を大切にしたいという気持ちが伝わってきます。あとは「考える」だけでなく「行動する」一歩が、未来を大きく変えていきます。'},
  {max:80,  name:'育児協力型', desc:'育児に積極的に関わろうとする姿勢が、すでに見えています。この調子で、できることを少しずつ増やしていきましょう。'},
  {max:100, name:'育児参加型', desc:'家族との時間を何よりも大切にする、理想的な姿勢です。この意識を、これからもずっと大切にしてください。'}
];

const SCREENS = ['splash','opening','quiz','result','negative','positive','comparison','actions','summary'];

/* ---------------- State ---------------- */
let state = { screenIdx:0, qIndex:0, answers:[] };

function totalScorePct(){
  const sum = state.answers.reduce((a,b)=>a+b.s,0);
  return Math.round(sum/120*100);
}
function catScores(){
  const c = {wife:0,child:0,time:0,growth:0};
  state.answers.forEach(a=>{ c[a.cat]+=a.s; });
  return c;
}
function catPct(c){ return Math.round(c/30*100); }
function getType(pct){
  return TYPES.find(t=>pct<=t.max) || TYPES[TYPES.length-1];
}
function weakestOrder(){
  const c = catScores();
  return Object.keys(c).sort((a,b)=>c[a]-c[b]);
}

/* ---------------- Render: chrome ---------------- */
function renderDots(){
  const dots = document.getElementById('dots');
  dots.innerHTML = SCREENS.map((s,i)=>{
    const cls = i===state.screenIdx ? 'active' : (i<state.screenIdx ? 'done' : '');
    return `<span class="dot ${cls}"></span>`;
  }).join('');
}

function go(screenName){
  state.screenIdx = SCREENS.indexOf(screenName);
  render();
}
function next(){ go(SCREENS[state.screenIdx+1]); }

function restart(){
  state = {screenIdx:0, qIndex:0, answers:[]};
  render();
}

/* ---------------- Screens ---------------- */
function render(){
  renderDots();
  const screen = SCREENS[state.screenIdx];
  const content = document.getElementById('content');
  const footer = document.getElementById('footer');
  content.innerHTML = '';
  footer.innerHTML = '';

  if(screen==='splash') return renderSplash(content,footer);
  if(screen==='opening') return renderOpening(content,footer);
  if(screen==='quiz') return renderQuiz(content,footer);
  if(screen==='result') return renderResult(content,footer);
  if(screen==='negative') return renderFuture(content,footer,'neg');
  if(screen==='positive') return renderFuture(content,footer,'pos');
  if(screen==='comparison') return renderComparison(content,footer);
  if(screen==='actions') return renderActions(content,footer);
  if(screen==='summary') return renderSummary(content,footer);
}

function renderSplash(content,footer){
  content.innerHTML = `
    <div class="screen">
      <div class="splash-art">
        <div class="moon"></div>
        <div class="silhouette">
          <div class="figure"></div>
          <div class="figure small"></div>
          <div class="figure" style="height:48px"></div>
        </div>
      </div>
      <div class="eyebrow">Mirai Papa Simulator</div>
      <h1 class="title">あなたの選択が、<br>未来の家族をつくる。</h1>
      <p class="lead">将来の自分と家族の姿を、12の質問でシミュレーションしてみましょう。育児に関わるかどうかで、10年後の家族はどう変わる？</p>
    </div>`;
  footer.innerHTML = `<button class="btn btn-primary" onclick="next()">はじめる</button>`;
}

function renderOpening(content,footer){
  content.innerHTML = `
    <div class="screen">
      <div class="eyebrow">Prologue</div>
      <h1 class="title">これは、あなたが<br>"父になった未来"の物語。</h1>
      <p class="lead">さあ、未来の家族のために、<br>今のあなたの考えを教えてください。</p>
      <p class="lead" style="margin-top:18px;">所要時間は、およそ2分です。質問は12個。正解はありません、思った通りに答えてみてください。</p>
    </div>`;
  footer.innerHTML = `<button class="btn btn-primary" onclick="next()">質問にこたえる</button>`;
}

function renderQuiz(content,footer){
  const q = QUESTIONS[state.qIndex];
  const cat = CATS[q.cat];
  const pct = Math.round((state.qIndex)/QUESTIONS.length*100);
  content.innerHTML = `
    <div class="screen">
      <div class="qprog-track"><div class="qprog-fill" style="width:${pct}%"></div></div>
      <div class="qcount">
        <span class="qcat">${ICONS[cat.icon]} ${cat.label}</span>
        <span>${state.qIndex+1} / ${QUESTIONS.length}</span>
      </div>
      <div class="qtext">${q.text}</div>
      <div id="optWrap">
        ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.l}</button>`).join('')}
      </div>
    </div>`;
  content.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      content.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      const i = parseInt(btn.dataset.i,10);
      const o = q.opts[i];
      setTimeout(()=>{
        state.answers[state.qIndex] = {cat:q.cat, s:o.s};
        if(state.qIndex < QUESTIONS.length-1){
          state.qIndex++;
          renderQuiz(content,footer);
        } else {
          go('result');
        }
      },280);
    });
  });
  footer.innerHTML = `<button class="btn-ghost" id="skipLink">あとで続ける（残りはスキップ）</button>`;
  document.getElementById('skipLink').addEventListener('click', ()=>{
    for(let i=state.qIndex;i<QUESTIONS.length;i++){
      if(!state.answers[i]) state.answers[i] = {cat:QUESTIONS[i].cat, s:6};
    }
    go('result');
  });
}

function renderResult(content,footer){
  const pct = totalScorePct();
  const type = getType(pct);
  content.innerHTML = `
    <div class="screen">
      <div class="eyebrow">診断結果</div>
      <h1 class="title">あなたの父親タイプは…</h1>
      <div class="result-card">
        <div class="type-name">${type.name}</div>
        <div><span class="score-num" id="scoreNum">0</span><span class="score-unit"> / 100点</span></div>
        <div class="score-bar-track"><div class="score-bar-fill" id="scoreBar" style="width:0%"></div></div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--cream-dim); margin-top:4px;">育児参加意識スコア</div>
      </div>
      <div class="desc-box">${type.desc}</div>
    </div>`;
  footer.innerHTML = `<button class="btn btn-primary" onclick="next()">10年後の未来を見る</button>`;
  // count-up animation
  const numEl = document.getElementById('scoreNum');
  const barEl = document.getElementById('scoreBar');
  let cur = 0;
  const step = Math.max(1, Math.round(pct/30));
  const timer = setInterval(()=>{
    cur += step;
    if(cur>=pct){ cur = pct; clearInterval(timer); }
    numEl.textContent = cur;
    barEl.style.width = cur + '%';
  }, 20);
}

function renderFuture(content,footer,mode){
  const pct = totalScorePct();
  const type = getType(pct);
  const isNeg = mode==='neg';
  const heading = isNeg
    ? `このまま「${type.name}」のまま、何も変えなければ…`
    : `もし、積極的に育児へ参加したら…`;
  const sub = isNeg ? '10年後の、何も変わらなかったあなた' : '10年後の、変わろうとしたあなた';
  content.innerHTML = `
    <div class="screen">
      <div class="future-head">
        <span class="future-tag ${isNeg?'neg':'pos'}">${isNeg?'NEGATIVE FUTURE':'POSITIVE FUTURE'}</span>
      </div>
      <h1 class="title" style="font-size:21px;">${heading}</h1>
      <p class="lead" style="margin-bottom:18px;">${sub}</p>
      ${Object.keys(CATS).map(k=>`
        <div class="row ${isNeg?'neg':'pos'}">
          <div class="ico">${ICONS[CATS[k].icon]}</div>
          <div>
            <div class="label">${CATS[k].label}</div>
            <div class="val">${isNeg ? ROWS[k].neg : ROWS[k].pos}</div>
          </div>
        </div>`).join('')}
      <div class="quote-card">
        <div class="quote-who">10年後の子どもより</div>
        <div class="quote-text">${isNeg?MESSAGES.neg.child:MESSAGES.pos.child}</div>
      </div>
      <div class="quote-card">
        <div class="quote-who">10年後のパートナーより</div>
        <div class="quote-text">${isNeg?MESSAGES.neg.partner:MESSAGES.pos.partner}</div>
      </div>
    </div>`;
  footer.innerHTML = isNeg
    ? `<button class="btn btn-primary" onclick="next()">もし、変わったら？</button>`
    : `<button class="btn btn-primary" onclick="next()">2つの未来を比較する</button>`;
}

function renderComparison(content,footer){
  content.innerHTML = `
    <div class="screen">
      <div class="eyebrow">Two Futures</div>
      <h1 class="title" style="font-size:21px;">未来は、ここで分かれる。</h1>
      <div class="road-wrap">
        <svg id="roadSvg" viewBox="0 0 320 200" width="100%" height="190">
          <circle cx="160" cy="22" r="6" fill="#E8B86D"/>
          <text x="160" y="14" text-anchor="middle" fill="#C9C2B2" font-size="10" font-family="JetBrains Mono">今のあなた</text>
          <path id="pathNeg" d="M160 26 C 110 70, 70 100, 40 175" stroke="#8089A0" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path id="pathPos" d="M160 26 C 210 70, 250 100, 280 175" stroke="#E8B86D" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="40" cy="178" r="7" fill="#8089A0"/>
          <circle cx="280" cy="178" r="7" fill="#E8B86D"/>
          <text x="40" y="195" text-anchor="middle" fill="#8089A0" font-size="9.5" font-family="Zen Kaku Gothic New">変わらない未来</text>
          <text x="280" y="195" text-anchor="middle" fill="#E8B86D" font-size="9.5" font-family="Zen Kaku Gothic New">変わる未来</text>
        </svg>
      </div>
      <div class="compare-cols">
        <div class="col neg">
          <h3>現在のままの未来</h3>
          ${Object.keys(CATS).map(k=>`<div class="mini-row"><span class="mini-cat">${CATS[k].label}</span>${ROWS[k].neg}</div>`).join('')}
        </div>
        <div class="col pos">
          <h3>育児に参加した未来</h3>
          ${Object.keys(CATS).map(k=>`<div class="mini-row"><span class="mini-cat">${CATS[k].label}</span>${ROWS[k].pos}</div>`).join('')}
        </div>
      </div>
    </div>`;
  footer.innerHTML = `<button class="btn btn-primary" onclick="next()">今からできることを見る</button>`;

  // draw-in animation for road paths
  requestAnimationFrame(()=>{
    ['pathNeg','pathPos'].forEach(id=>{
      const p = document.getElementById(id);
      if(!p) return;
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.style.transition = 'stroke-dashoffset 1s ease';
      requestAnimationFrame(()=>{ p.style.strokeDashoffset = 0; });
    });
  });
}

function renderActions(content,footer){
  const order = weakestOrder();
  const top = order[0];
  const rest = order.slice(1);
  content.innerHTML = `
    <div class="screen">
      <div class="eyebrow">Action Plan</div>
      <h1 class="title" style="font-size:21px;">未来は、今日からの一歩で変わる。</h1>
      <div class="action-priority">
        <div class="eyebrow">まず意識したいこと（${CATS[top].label}）</div>
        <div class="atext">${ACTIONS[top]}</div>
      </div>
      <div>
        ${rest.map((k,i)=>`
          <div class="action-item">
            <span class="num">0${i+2}</span>
            <span>${ACTIONS[k]}</span>
          </div>`).join('')}
      </div>
    </div>`;
  footer.innerHTML = `<button class="btn btn-primary" onclick="next()">まとめを見る</button>`;
}

function renderSummary(content,footer){
  const pct = totalScorePct();
  const type = getType(pct);
  content.innerHTML = `
    <div class="screen">
      <div class="summary-art">
        <div class="sun"></div>
        <div class="silhouette">
          <div class="figure" style="height:46px"></div>
          <div class="figure small"></div>
          <div class="figure" style="height:46px"></div>
        </div>
      </div>
      <h1 class="title" style="font-size:22px;">未来は、<br>あなたの選択で変えられる。</h1>
      <p class="lead">小さな一歩が、10年後の家族の笑顔につながります。</p>
      <div class="recap">
        <div>
          <div class="label" style="font-family:var(--font-mono); font-size:11px; color:var(--cream-dim);">診断タイプ</div>
          <div class="rtype">${type.name}</div>
        </div>
        <div class="rscore">${pct}<span style="font-size:12px; color:var(--cream-dim);">/100</span></div>
      </div>
      <p class="credit-note">この体験はあくまでシミュレーションです。実際の家族のかたちに、決まった正解はありません。</p>
    </div>`;
  footer.innerHTML = `
    <button class="btn btn-secondary" onclick="restart()">もう一度診断する</button>
  `;
}

/* ---------------- Help modal ---------------- */
document.getElementById('helpBtn').addEventListener('click', ()=>{
  document.getElementById('modalOverlay').classList.add('show');
});
document.getElementById('modalClose').addEventListener('click', ()=>{
  document.getElementById('modalOverlay').classList.remove('show');
});

render();
</script>
</body>
</html>
