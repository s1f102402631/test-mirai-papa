<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>みらいパパ ― 未来の育児シミュレーター</title><link rel="stylesheet" href="style.css"><style>
/* ナビゲーションだけを調整。既存の「みらいパパ」のデザインは変更しない */
.brand{appearance:none;-webkit-appearance:none;background:transparent;border:0;padding:0;margin:0;color:var(--gold);cursor:pointer;font:inherit}
.quick-icon.external-box{background:transparent!important;border:0!important;border-radius:0!important;color:inherit!important}
.back-link{appearance:none;-webkit-appearance:none;background:transparent!important;border:0!important;box-shadow:none!important;color:var(--cream-dim);padding:0;margin:0;min-width:0;width:auto!important;font-family:var(--font-mono);font-size:15px;line-height:1;cursor:pointer;align-self:flex-start}
.back-link:hover{background:transparent!important;border:0!important;color:var(--gold)}
.survey-submit{width:auto!important;min-width:72px;padding:9px 18px!important;font-size:12px!important;border-radius:9px!important;align-self:center}
.survey-back{appearance:none;-webkit-appearance:none;background:transparent!important;border:0!important;box-shadow:none!important;color:var(--cream-dim);padding:0;margin:0;width:auto!important;font-family:var(--font-mono);font-size:15px;line-height:1;cursor:pointer;align-self:flex-start}
.survey-back:hover{color:var(--gold)}
</style></head>
<body><div class="stars"></div><div class="phone"><div class="topbar"><button class="brand" id="brandHome" aria-label="最初の画面に戻る">みらいパパ</button><div class="dots" id="dots"></div><button class="help-btn" id="helpBtn" aria-label="ヘルプ">?</button></div><div class="content" id="content"></div><div class="footer" id="footer"></div></div><div class="modal-overlay" id="modalOverlay"><div class="modal-box"><h2>このアプリについて</h2><p>「みらいパパ」は、将来父親になるかもしれないあなたが、育児への向き合い方によって変わる10年後の家族の姿を疑似体験できるシミュレーターです。12個の質問に答えると、あなたの今の意識タイプと、2つの未来（育児に関わらなかった場合／積極的に関わった場合）が表示されます。</p><p>結果に正解・不正解はありません。未来は、これからのあなたの選択次第で変えられます。</p><button class="btn btn-primary" id="modalClose">閉じる</button></div></div>
<script>
const ICONS={heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.5s-7.5-4.6-9.8-9.4C.8 7.7 2.4 4.5 5.6 4c2-.3 3.7.6 4.9 2.1L12 7.6l1.5-1.5c1.2-1.5 2.9-2.4 4.9-2.1 3.2.5 4.8 3.7 3.4 7.1-2.3 4.8-9.8 9.4-9.8 9.4z"/></svg>',child:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="3.2"/><path d="M6 21v-3.5C6 14.5 8.5 13 12 13s6 1.5 6 4.5V21"/></svg>',clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5.7 1.5 1.5z"/></svg>'};
const CATS={wife:{label:'妻との関係',icon:'heart'},child:{label:'子どもとの関係',icon:'child'},time:{label:'家族時間',icon:'clock'},growth:{label:'育児への意識',icon:'book'}};
const ROWS={wife:{neg:'すれ違いが増えている',pos:'信頼し合えるパートナーに'},child:{neg:'会話が少ない',pos:'何でも話せる関係に'},time:{neg:'週に1時間未満',pos:'週に10時間以上'},growth:{neg:'育児への関心が薄れている',pos:'学び続け、頼れる存在に'}};
const ACTIONS={wife:'パートナーの話を、最後まで聞く時間をつくる',child:'子どもの行事や送り迎えに、月1回からでも参加してみる',time:'育休制度について、今のうちに調べておく',growth:'育児の本やSNSで、先輩パパの体験談を読んでみる'};
const MESSAGES={neg:{child:'お父さんとはあまり話さなかったな…。でも、今は別に困ってないよ。',partner:'ずっと一人で育児を頑張ってきました。正直、もっと一緒に悩んでほしかった。'},pos:{child:'お父さんがいつも話を聞いてくれたから、今でも何でも相談できるよ。ありがとう。',partner:'一緒に育児を頑張ってくれて、本当に助かりました。あなたのおかげで今の私たちがあります。'}};
const QUESTIONS=[{cat:'wife',text:'家事や育児の分担について、どう考えますか？',opts:[{l:'できる限り半分ずつ担いたい',s:10},{l:'状況に応じて柔軟に分担したい',s:6},{l:'得意な方が多く担当すればいい',s:2}]},{cat:'child',text:'子どもの送り迎えや習い事の付き添いは？',opts:[{l:'自分も積極的に担当したい',s:10},{l:'パートナーと交代でやりたい',s:6},{l:'基本的にはパートナーに任せたい',s:2}]},{cat:'time',text:'休日の過ごし方は、どちらに近いですか？',opts:[{l:'家族との時間を最優先にしたい',s:10},{l:'家族と自分の時間を半々にしたい',s:6},{l:'自分の時間も大切にしたい',s:2}]},{cat:'growth',text:'育児に関する知識や情報を学ぶことについて',opts:[{l:'積極的に学びたい',s:10},{l:'必要になったら学べばいい',s:6},{l:'パートナーに任せておけば十分',s:2}]},{cat:'wife',text:'共働きについて、どう考えますか？',opts:[{l:'積極的にしたい',s:10},{l:'どちらでもよい',s:6},{l:'したくない',s:2}]},{cat:'child',text:'子どもの夜泣きや夜間の対応について',opts:[{l:'自分も交代で対応したい',s:10},{l:'余裕があるときは対応したい',s:6},{l:'基本はパートナーに任せたい',s:2}]},{cat:'time',text:'育児休業の取得について、どう思いますか？',opts:[{l:'できるだけ長く取りたい',s:10},{l:'短期間でも取りたい',s:6},{l:'取らなくてもいいと思う',s:2}]},{cat:'growth',text:'自分のキャリアと育児のバランスについて',opts:[{l:'育児のために働き方を見直したい',s:10},{l:'状況によって調整したい',s:6},{l:'キャリアを優先したい',s:2}]},{cat:'wife',text:'パートナーが悩みや不満を話してきたとき',opts:[{l:'じっくり話を聞き、一緒に考えたい',s:10},{l:'時間があれば聞きたい',s:6},{l:'あまり深く関わりたくない',s:2}]},{cat:'child',text:'子どもの行事（運動会・発表会など）について',opts:[{l:'必ず参加したい',s:10},{l:'できる範囲で参加したい',s:6},{l:'仕事が優先になると思う',s:2}]},{cat:'time',text:'子どもとの時間を確保するために',opts:[{l:'仕事を調整してでも時間を作りたい',s:10},{l:'余った時間でなるべく作りたい',s:6},{l:'特に意識していない',s:2}]},{cat:'growth',text:'将来、子どもにとってどんな存在でいたいですか？',opts:[{l:'何でも話せる、頼れる存在でいたい',s:10},{l:'必要なときに頼れる存在でいい',s:6},{l:'あまり意識していない',s:2}]}];
const TYPES=[{max:30,name:'仕事優先型',desc:'仕事に全力を注ぐ姿勢は、それ自体は立派なことです。ただ、このままでは育児や家庭との時間が後回しになりがち。少しずつ、家庭にも目を向けるバランスを意識してみましょう。'},{max:55,name:'バランス型',desc:'仕事と家庭、両方を大切にしたいという気持ちが伝わってきます。あとは「考える」だけでなく「行動する」一歩が、未来を大きく変えていきます。'},{max:80,name:'育児協力型',desc:'育児に積極的に関わろうとする姿勢が、すでに見えています。この調子で、できることを少しずつ増やしていきましょう。'},{max:100,name:'育児参加型',desc:'家族との時間を何よりも大切にする、理想的な姿勢です。この意識を、これからもずっと大切にしてください。'}];
const SCREENS=['splash','opening','quiz','result','negative','positive','comparison','actions','summary','survey','externalInfo'];let state={screenIdx:0,qIndex:0,answers:[]};
function totalScorePct(){const sum=state.answers.reduce((a,b)=>a+b.s,0);return Math.round(sum/120*100)}function catScores(){const c={wife:0,child:0,time:0,growth:0};state.answers.forEach(a=>{c[a.cat]+=a.s});return c}function getType(pct){return TYPES.find(t=>pct<=t.max)||TYPES[TYPES.length-1]}function weakestOrder(){const c=catScores();return Object.keys(c).sort((a,b)=>c[a]-c[b])}function renderDots(){document.getElementById('dots').innerHTML=SCREENS.map((s,i)=>`<span class="dot ${i===state.screenIdx?'active':i<state.screenIdx?'done':''}"></span>`).join('')}function go(screenName){state.screenIdx=SCREENS.indexOf(screenName);render()}function next(){go(SCREENS[state.screenIdx+1])}function restart(){state={screenIdx:0,qIndex:0,answers:[]};render()}
function render(){renderDots();const screen=SCREENS[state.screenIdx],content=document.getElementById('content'),footer=document.getElementById('footer');content.innerHTML='';footer.innerHTML='';if(screen==='splash')return renderSplash(content,footer);if(screen==='opening')return renderOpening(content,footer);if(screen==='quiz')return renderQuiz(content,footer);if(screen==='result')return renderResult(content,footer);if(screen==='negative')return renderFuture(content,footer,'neg');if(screen==='positive')return renderFuture(content,footer,'pos');if(screen==='comparison')return renderComparison(content,footer);if(screen==='actions')return renderActions(content,footer);if(screen==='summary')return renderSummary(content,footer);if(screen==='survey')return renderSurvey(content,footer);if(screen==='externalInfo')return renderExternalInfo(content,footer)}
function renderSplash(content,footer){content.innerHTML=`<div class="screen splash-screen"><div class="splash-art"><div class="moon"></div><div class="silhouette"><div class="figure"></div><div class="figure small"></div><div class="figure" style="height:48px"></div></div></div><h1 class="title">あなたの選択が、<br>未来の家族をつくる。</h1><p class="lead">将来の自分と家族の姿を、12の質問でシミュレーションしてみましょう。育児に関わるかどうかで、10年後の家族はどう変わる？</p></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">はじめる</button><div class="quick-links icon-links"><button class="quick-link icon-link" onclick="go('survey')"><span class="quick-icon">📝</span><small>アンケート</small></button><button class="quick-link icon-link" onclick="go('externalInfo')"><span class="quick-icon external-box">↗</span><small>情報</small></button></div>`}
function renderOpening(content,footer){content.innerHTML=`<div class="screen"><div class="eyebrow">Prologue</div><h1 class="title">これは、あなたが<br>\"父になった未来\"の物語。</h1><p class="lead">さあ、未来の家族のために、<br>今のあなたの考えを教えてください。</p><p class="lead" style="margin-top:18px;">所要時間は、およそ2分です。質問は12個。正解はありません、思った通りに答えてみてください。</p></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">質問にこたえる</button>`}
function renderQuiz(content,footer){const q=QUESTIONS[state.qIndex],cat=CATS[q.cat],pct=Math.round(state.qIndex/QUESTIONS.length*100);content.innerHTML=`<div class="screen"><div class="qprog-track"><div class="qprog-fill" style="width:${pct}%"></div></div><div class="qcount"><span class="qcat">${ICONS[cat.icon]} ${cat.label}</span><span>${state.qIndex+1} / ${QUESTIONS.length}</span></div><div class="qtext">${q.text}</div><div id="optWrap">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.l}</button>`).join('')}</div></div>`;content.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{content.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const i=parseInt(btn.dataset.i,10),o=q.opts[i];setTimeout(()=>{state.answers[state.qIndex]={cat:q.cat,s:o.s};if(state.qIndex<QUESTIONS.length-1){state.qIndex++;renderQuiz(content,footer)}else go('result')},280)}));footer.innerHTML=`<button class="btn-ghost" id="skipLink">あとで続ける（残りはスキップ）</button>`;document.getElementById('skipLink').addEventListener('click',()=>{for(let i=state.qIndex;i<QUESTIONS.length;i++)if(!state.answers[i])state.answers[i]={cat:QUESTIONS[i].cat,s:6};go('result')})}
function renderResult(content,footer){const pct=totalScorePct(),type=getType(pct);content.innerHTML=`<div class="screen"><div class="eyebrow">診断結果</div><h1 class="title">あなたの父親タイプは…</h1><div class="result-card"><div class="type-name">${type.name}</div><div><span class="score-num" id="scoreNum">0</span><span class="score-unit"> / 100点</span></div><div class="score-bar-track"><div class="score-bar-fill" id="scoreBar" style="width:0%"></div></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--cream-dim);margin-top:4px;">育児参加意識スコア</div></div><div class="desc-box">${type.desc}</div></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">10年後の未来を見る</button>`;const numEl=document.getElementById('scoreNum'),barEl=document.getElementById('scoreBar');let cur=0;const step=Math.max(1,Math.round(pct/30));const timer=setInterval(()=>{cur+=step;if(cur>=pct){cur=pct;clearInterval(timer)}numEl.textContent=cur;barEl.style.width=cur+'%'},20)}
function renderFuture(content,footer,mode){const pct=totalScorePct(),type=getType(pct),isNeg=mode==='neg',heading=isNeg?`このまま「${type.name}」のまま、何も変えなければ…`:`もし、積極的に育児へ参加したら…`,sub=isNeg?'10年後の、何も変わらなかったあなた':'10年後の、変わろうとしたあなた';content.innerHTML=`<div class="screen"><div class="future-head"><span class="future-tag ${isNeg?'neg':'pos'}">${isNeg?'NEGATIVE FUTURE':'POSITIVE FUTURE'}</span></div><h1 class="title" style="font-size:21px;">${heading}</h1><p class="lead" style="margin-bottom:18px;">${sub}</p>${Object.keys(CATS).map(k=>`<div class="row ${isNeg?'neg':'pos'}"><div class="ico">${ICONS[CATS[k].icon]}</div><div><div class="label">${CATS[k].label}</div><div class="val">${isNeg?ROWS[k].neg:ROWS[k].pos}</div></div></div>`).join('')}<div class="quote-card"><div class="quote-who">10年後の子どもより</div><div class="quote-text">${isNeg?MESSAGES.neg.child:MESSAGES.pos.child}</div></div><div class="quote-card"><div class="quote-who">10年後のパートナーより</div><div class="quote-text">${isNeg?MESSAGES.neg.partner:MESSAGES.pos.partner}</div></div></div>`;footer.innerHTML=isNeg?`<button class="btn btn-primary" onclick="next()">もし、変わったら？</button>`:`<button class="btn btn-primary" onclick="next()">2つの未来を比較する</button>`}
function renderComparison(content,footer){content.innerHTML=`<div class="screen"><div class="eyebrow">Two Futures</div><h1 class="title" style="font-size:21px;">未来は、ここで分かれる。</h1><div class="road-wrap"><svg id="roadSvg" viewBox="0 0 320 200" width="100%" height="190"><circle cx="160" cy="22" r="6" fill="#E8B86D"/><text x="160" y="14" text-anchor="middle" fill="#C9C2B2" font-size="10" font-family="JetBrains Mono">今のあなた</text><path id="pathNeg" d="M160 26 C 110 70, 70 100, 40 175" stroke="#8089A0" stroke-width="4" fill="none" stroke-linecap="round"/><path id="pathPos" d="M160 26 C 210 70, 250 100, 280 175" stroke="#E8B86D" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="40" cy="178" r="7" fill="#8089A0"/><circle cx="280" cy="178" r="7" fill="#E8B86D"/><text x="40" y="195" text-anchor="middle" fill="#8089A0" font-size="9.5" font-family="Zen Kaku Gothic New">変わらない未来</text><text x="280" y="195" text-anchor="middle" fill="#E8B86D" font-size="9.5" font-family="Zen Kaku Gothic New">変わる未来</text></svg></div><div class="compare-cols"><div class="col neg"><h3>現在のままの未来</h3>${Object.keys(CATS).map(k=>`<div class="mini-row"><span class="mini-cat">${CATS[k].label}</span>${ROWS[k].neg}</div>`).join('')}</div><div class="col pos"><h3>育児に参加した未来</h3>${Object.keys(CATS).map(k=>`<div class="mini-row"><span class="mini-cat">${CATS[k].label}</span>${ROWS[k].pos}</div>`).join('')}</div></div></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">今からできることを見る</button>`;requestAnimationFrame(()=>['pathNeg','pathPos'].forEach(id=>{const p=document.getElementById(id);if(!p)return;const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.style.transition='stroke-dashoffset 1s ease';requestAnimationFrame(()=>{p.style.strokeDashoffset=0})}))}
function renderActions(content,footer){const order=weakestOrder(),top=order[0],rest=order.slice(1);content.innerHTML=`<div class="screen"><div class="eyebrow">Action Plan</div><h1 class="title" style="font-size:21px;">未来は、今日からの一歩で変わる。</h1><div class="action-priority"><div class="eyebrow">まず意識したいこと（${CATS[top].label}）</div><div class="atext">${ACTIONS[top]}</div></div><div>${rest.map((k,i)=>`<div class="action-item"><span class="num">0${i+2}</span><span>${ACTIONS[k]}</span></div>`).join('')}</div></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">まとめを見る</button>`}
function renderSummary(content,footer){const pct=totalScorePct(),type=getType(pct);content.innerHTML=`<div class="screen"><div class="summary-art"><div class="sun"></div><div class="silhouette"><div class="figure" style="height:46px"></div><div class="figure small"></div><div class="figure" style="height:46px"></div></div></div><h1 class="title" style="font-size:22px;">未来は、<br>あなたの選択で変えられる。</h1><p class="lead">小さな一歩が、10年後の家族の笑顔につながります。</p><div class="recap"><div><div class="label" style="font-family:var(--font-mono);font-size:11px;color:var(--cream-dim);">診断タイプ</div><div class="rtype">${type.name}</div></div><div class="rscore">${pct}<span style="font-size:12px;color:var(--cream-dim);">/100</span></div></div><p class="credit-note">この体験はあくまでシミュレーションです。実際の家族のかたちに、決まった正解はありません。</p></div>`;footer.innerHTML=`<button class="btn btn-secondary" onclick="restart()">もう一度診断する</button>`}
function renderSurvey(content,footer){content.innerHTML=`<div class="screen survey-screen"><h1 class="title" style="font-size:22px;">アンケート</h1><div class="survey-list"><section class="survey-q"><div class="survey-no">Q1</div><h2>性別を教えてください。</h2><div class="survey-options">${['男性','女性','回答しない'].map(v=>`<label><input type="radio" name="q1" value="${v}"><span>${v}</span></label>`).join('')}</div></section><section class="survey-q"><div class="survey-no">Q2</div><h2>現在のご自身に最も近いものを選んでください。</h2><div class="survey-options">${['パパ・ママ','これからなる可能性が少しでもある','その他'].map(v=>`<label><input type="radio" name="q2" value="${v}"><span>${v}</span></label>`).join('')}</div></section><section class="survey-q"><div class="survey-category">① 育児への関心</div><div class="survey-no">Q3</div><h2>自分が将来（あるいは今）育児をすることについて、関心がある。</h2>${surveyScale('q3')}</section><section class="survey-q"><div class="survey-category">② 育児に対する理解</div><div class="survey-no">Q4</div><h2>育児とは具体的にどのようなことをするのか、理解している。</h2>${surveyScale('q4')}</section><section class="survey-q"><div class="survey-category">③ 当事者意識</div><div class="survey-no">Q5</div><h2>育児は「自分にも関係のあること」だと感じている。</h2>${surveyScale('q5')}</section></div></div>`;footer.innerHTML=`<button class="survey-back" onclick="go('splash')">←</button><button class="btn btn-primary survey-submit" onclick="submitSurvey()">送信</button>`}
function surveyScale(name){return `<div class="survey-scale"><div class="survey-scale-label"><span>まったくそう思わない</span><span>とてもそう思う</span></div><div class="survey-scale-buttons">${Array.from({length:10},(_,i)=>`<label><input type="radio" name="${name}" value="${i+1}"><span>${i+1}</span></label>`).join('')}</div></div>`}
function submitSurvey(){const required=['q1','q2','q3','q4','q5'];if(!required.every(name=>document.querySelector(`input[name="${name}"]:checked`))){alert('すべての質問に回答してください。');return}go('splash')}
function renderExternalInfo(content,footer){const items=[['こども家庭庁','こども・子育てに関する制度や施策などの情報。','https://www.cfa.go.jp/'],['厚生労働省','育児休業や仕事と子育ての両立に関する情報。','https://www.mhlw.go.jp/']];content.innerHTML=`<div class="screen external-screen"><div class="eyebrow">External Information</div><h1 class="title" style="font-size:22px;">外部情報</h1><p class="lead">育児や子育てについて、さらに知りたいときの情報源です。</p><div class="external-list">${items.map(x=>`<a class="external-card" href="${x[2]}" target="_blank" rel="noopener noreferrer"><div class="external-icon">↗</div><div><div class="info-title">${x[0]}</div><div class="info-desc">${x[1]}</div></div></a>`).join('')}</div></div>`;footer.innerHTML=`<button class="back-link" onclick="go('splash')">←</button>`}
document.getElementById('brandHome').addEventListener('click',restart);document.getElementById('helpBtn').addEventListener('click',()=>document.getElementById('modalOverlay').classList.add('show'));document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modalOverlay').classList.remove('show'));render();
</script>
</body>
</html>
