<body><div class="stars"></div><div class="phone"><div class="topbar"><button class="brand" id="brandHome" aria-label="最初の画面に戻る">みらいパパ</button><div class="dots" id="dots"></div><button class="help-btn" id="helpBtn" aria-label="ヘルプ">?</button></div><div class="content" id="content"></div><div class="footer" id="footer"></div></div><div class="modal-overlay" id="modalOverlay"><div class="modal-box"><h2>このアプリについて</h2><p>「みらいパパ」は、将来父親になるかもしれないあなたが、育児への向き合い方によって変わる10年後の家族の姿を疑似体験できるシミュレーターです。12個の質問に答えると、あなたの今の意識タイプと、2つの未来（育児に関わらなかった場合／積極的に関わった場合）が表示されます。</p><p>結果に正解・不正解はありません。未来は、これからのあなたの選択次第で変えられます。</p><button class="btn btn-primary" id="modalClose">閉じる</button></div></div>

// ===== 「最後にひとつだけ」の質問と、結果画面の分担比較 =====
// 文章や調査データを直すときは、この PERCEPTION_GAP だけを編集すればOK。この回答はスコアに含めない。
const PERCEPTION_GAP={
  eyebrow:'最後にひとつだけ',
  question:'将来、家事・育児のうち、あなたは何割くらいを担うと思いますか？',
  ends:['0割','5割（半分）','10割'],
  note:'この質問はスコアには含まれません。',
  title:'家事・育児の分担、どう見えている？',
  research:[{label:'夫が思う自分の分担',value:4,cls:'self'},{label:'妻から見た夫の分担',value:2,cls:'partner'}],
  message:'多くの夫婦で、夫が「やっているつもり」の分担は、パートナーから見ると半分ほどです。',
  personal:v=>`あなたが思う「${v}割」も、パートナーから見ると違って見えるかもしれません。ときどき、お互いの見え方を話してみるのがおすすめです。`,
  source:'出典：パナソニック「30・40代夫婦のライフスタイル調査」（2017年、共働き夫婦の家事分担）'
};
const SCREENS=['splash','opening','quiz','lastQuestion','result','negative','positive','comparison','actions','summary','survey','externalInfo','surveyResults'];const newState=()=>({screenIdx:0,qIndex:0,answers:[],optOrder:[],picked:[],mySurvey:null,shareEstimate:null});let state=newState();
function totalScorePct(){const sum=state.answers.reduce((a,b)=>a+b.s,0);return Math.round(sum/120*100)}function catScores(){const c={wife:0,child:0,time:0,growth:0};state.answers.forEach(a=>{c[a.cat]+=a.s});return c}function getType(pct){return TYPES.find(t=>pct<=t.max)||TYPES[TYPES.length-1]}function weakestOrder(){const c=catScores();return Object.keys(c).sort((a,b)=>c[a]-c[b])}function renderDots(){document.getElementById('dots').innerHTML=SCREENS.map((s,i)=>`<span class="dot ${i===state.screenIdx?'active':i<state.screenIdx?'done':''}"></span>`).join('')}function go(screenName){state.screenIdx=SCREENS.indexOf(screenName);render()}function next(){go(SCREENS[state.screenIdx+1])}function restart(){state=newState();render()}
function shuffled(n){const a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function catPcts(){const c=catScores();return Object.fromEntries(Object.keys(c).map(k=>[k,Math.round(c[k]/(QUESTIONS.filter(q=>q.cat===k).length*10)*100)]))}
// 情報ページ（index.html）から、診断結果に合わせたおすすめを出すために参照される
function getDiagnosis(){if(state.answers.filter(Boolean).length<QUESTIONS.length)return null;const w=weakestOrder()[0];return{type:getType(totalScorePct()).name,weakest:w,weakestLabel:CATS[w].label,picked:state.picked.slice()}}
function radarSvg(p,weak){const keys=Object.keys(CATS),cx=150,cy=100,R=62,pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI*2/keys.length;return[+(cx+Math.cos(a)*r).toFixed(1),+(cy+Math.sin(a)*r).toFixed(1)]},poly=f=>keys.map((k,i)=>pt(i,f(k)).join(',')).join(' '),lab=[[cx,cy-R-26,'middle'],[cx+R+10,cy-6,'start'],[cx,cy+R+18,'middle'],[cx-R-10,cy-6,'end']];return `<svg class="radar" viewBox="0 0 300 200" width="100%" role="img" aria-label="${keys.map(k=>CATS[k].label+' '+p[k]+'点').join('、')}">${[.25,.5,.75,1].map(f=>`<polygon points="${poly(()=>R*f)}" fill="none" stroke="rgba(246,239,226,.12)"/>`).join('')}${keys.map((k,i)=>{const[x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(246,239,226,.12)"/>`}).join('')}<g class="radar-shape"><polygon points="${poly(k=>R*p[k]/100)}" fill="rgba(232,184,109,.28)" stroke="#E8B86D" stroke-width="2" stroke-linejoin="round"/>${keys.map((k,i)=>{const[x,y]=pt(i,R*p[k]/100);return `<circle cx="${x}" cy="${y}" r="3.5" fill="${k===weak?'#F09A66':'#E8B86D'}"/>`}).join('')}</g>${keys.map((k,i)=>{const[x,y,a]=lab[i];return `<text x="${x}" y="${y}" text-anchor="${a}" fill="${k===weak?'#F09A66':'#C9C2B2'}" font-size="10.5" font-family="Zen Kaku Gothic New">${CATS[k].label}</text><text x="${x}" y="${y+15}" text-anchor="${a}" fill="${k===weak?'#F09A66':'#F6EFE2'}" font-size="12.5" font-weight="700" font-family="JetBrains Mono">${p[k]}</text>`}).join('')}</svg>`}
function render(){renderDots();const screen=SCREENS[state.screenIdx],content=document.getElementById('content'),footer=document.getElementById('footer');content.innerHTML='';content.scrollTop=0;footer.innerHTML='';if(screen==='splash')return renderSplash(content,footer);if(screen==='opening')return renderOpening(content,footer);if(screen==='quiz')return renderQuiz(content,footer);if(screen==='lastQuestion')return renderLastQuestion(content,footer);if(screen==='result')return renderResult(content,footer);if(screen==='negative')return renderFuture(content,footer,'neg');if(screen==='positive')return renderFuture(content,footer,'pos');if(screen==='comparison')return renderComparison(content,footer);if(screen==='actions')return renderActions(content,footer);if(screen==='summary')return renderSummary(content,footer);if(screen==='survey')return renderSurvey(content,footer);if(screen==='externalInfo')return renderExternalInfo(content,footer);if(screen==='surveyResults')return renderSurveyResults(content,footer)}
function renderSplash(content,footer){content.innerHTML=`<div class="screen splash-screen"><div class="splash-art"><div class="moon"></div><div class="silhouette"><div class="figure"></div><div class="figure small"></div><div class="figure" style="height:48px"></div></div></div><h1 class="title">あなたの選択が、<br>未来の家族をつくる。</h1><p class="lead">将来の自分と家族の姿を、12の質問でシミュレーションしてみましょう。育児に関わるかどうかで、10年後の家族はどう変わる？</p></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">はじめる</button><div class="quick-links icon-links"><button class="quick-link icon-link" onclick="go('survey')"><span class="quick-icon">📝</span><small>アンケート</small></button><button class="quick-link icon-link" onclick="go('externalInfo')"><span class="quick-icon external-box">↗</span><small>情報</small></button><button class="quick-link icon-link" onclick="go('surveyResults')"><span class="quick-icon">📊</span><small>みんなの結果</small></button></div>`}
function renderOpening(content,footer){content.innerHTML=`<div class="screen"><div class="eyebrow">Prologue</div><h1 class="title">これは、あなたが<br>\"父になった未来\"の物語。</h1><p class="lead">さあ、未来の家族のために、<br>今のあなたの考えを教えてください。</p><p class="lead" style="margin-top:18px;">所要時間は、およそ2分です。質問は12個。正解はありません、思った通りに答えてみてください。</p></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">質問にこたえる</button>`}
function renderQuiz(content,footer){const q=QUESTIONS[state.qIndex],cat=CATS[q.cat],pct=Math.round(state.qIndex/QUESTIONS.length*100);if(!state.optOrder[state.qIndex])state.optOrder[state.qIndex]=shuffled(q.opts.length);const order=state.optOrder[state.qIndex],prev=state.answers[state.qIndex];let locked=false;content.innerHTML=`<div class="screen"><div class="qprog-track"><div class="qprog-fill" style="width:${pct}%"></div></div><div class="qcount"><span class="qcat">${ICONS[cat.icon]} ${cat.label}</span><span>${state.qIndex+1} / ${QUESTIONS.length}</span></div><div class="qtext">${q.text}</div><div id="optWrap">${order.map(i=>`<button class="opt${prev&&prev.i===i?' selected':''}" data-i="${i}">${q.opts[i].l}</button>`).join('')}</div></div>`;content.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{if(locked)return;locked=true;content.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const i=parseInt(btn.dataset.i,10),o=q.opts[i];setTimeout(()=>{state.answers[state.qIndex]={cat:q.cat,s:o.s,i};if(state.qIndex<QUESTIONS.length-1){state.qIndex++;renderQuiz(content,footer)}else go('lastQuestion')},280)}));footer.innerHTML=`<div class="quiz-nav"><button class="btn-ghost quiz-back" id="quizBack">← 戻る</button><button class="btn-ghost" id="skipLink">あとで続ける（残りはスキップ）</button></div>`;document.getElementById('quizBack').addEventListener('click',()=>{if(locked)return;if(state.qIndex>0){state.qIndex--;renderQuiz(content,footer)}else go('opening')});document.getElementById('skipLink').addEventListener('click',()=>{for(let i=state.qIndex;i<QUESTIONS.length;i++)if(!state.answers[i])state.answers[i]={cat:QUESTIONS[i].cat,s:6};go('result')})}
function renderLastQuestion(content,footer){const g=PERCEPTION_GAP,v=state.shareEstimate;content.innerHTML=`<div class="screen"><div class="qprog-track"><div class="qprog-fill" style="width:100%"></div></div><div class="eyebrow">${g.eyebrow}</div><div class="qtext">${g.question}</div><div class="share-value" id="shareValue"></div><input type="range" class="share-range" id="shareRange" min="0" max="10" step="1" value="${v==null?5:v}" aria-label="${g.question}"><div class="share-ticks">${Array.from({length:11},(_,i)=>`<button type="button" class="share-tick" data-v="${i}" style="left:${i*10}%" aria-label="${i}割">${i}</button>`).join('')}</div><div class="share-ends">${g.ends.map(t=>`<span>${t}</span>`).join('')}</div><p class="share-note">${g.note}</p></div>`;footer.innerHTML=`<div class="quiz-nav"><button class="btn-ghost quiz-back" id="lastBack">← 戻る</button></div><button class="btn btn-primary" id="lastNext">結果を見る</button>`;const range=document.getElementById('shareRange'),valEl=document.getElementById('shareValue'),nextBtn=document.getElementById('lastNext');const paint=()=>{const cur=state.shareEstimate;range.classList.toggle('unset',cur==null);if(cur!=null)range.style.setProperty('--fill',`calc(14px + (100% - 28px) * ${cur/10})`);valEl.innerHTML=cur==null?'<small>スライダーか数字で選んでください</small>':`${cur}<small>割</small>`;content.querySelectorAll('.share-tick').forEach(b=>b.classList.toggle('active',Number(b.dataset.v)===cur));nextBtn.disabled=cur==null};range.addEventListener('input',()=>{state.shareEstimate=Number(range.value);paint()});content.querySelectorAll('.share-tick').forEach(b=>b.addEventListener('click',()=>{state.shareEstimate=Number(b.dataset.v);range.value=b.dataset.v;paint()}));document.getElementById('lastBack').addEventListener('click',()=>{state.qIndex=QUESTIONS.length-1;go('quiz')});nextBtn.addEventListener('click',()=>go('result'));paint()}
function gapCardHtml(){const g=PERCEPTION_GAP,v=state.shareEstimate,rows=[{label:'あなたの想定',value:v,cls:'you',text:v==null?'未回答':`${v}割`},...g.research.map(r=>({label:r.label,value:r.value,cls:r.cls,text:`約${r.value}割`}))];return `<div class="gap-card"><div class="radar-title">${g.title}</div>${rows.map(r=>`<div class="gap-row"><div class="gap-head"><span>${r.label}</span><span class="gap-val">${r.text}</span></div><div class="gap-track" title="${r.label}：${r.text}"><div class="gap-fill ${r.cls}" style="width:${(r.value||0)*10}%"></div></div></div>`).join('')}<p class="gap-msg">${g.message}</p>${v?`<p class="gap-msg sub">${g.personal(v)}</p>`:''}<p class="gap-source">${g.source}</p></div>`}
function renderResult(content,footer){const pct=totalScorePct(),type=getType(pct),p=catPcts(),weak=weakestOrder()[0];content.innerHTML=`<div class="screen"><div class="eyebrow">診断結果</div><h1 class="title">あなたの父親タイプは…</h1><div class="result-card"><div class="type-name">${type.name}</div><div><span class="score-num" id="scoreNum">0</span><span class="score-unit"> / 100点</span></div><div class="score-bar-track"><div class="score-bar-fill" id="scoreBar" style="width:0%"></div></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--cream-dim);margin-top:4px;">育児参加意識スコア</div></div><div class="radar-card"><div class="radar-title">カテゴリ別の内訳</div>${radarSvg(p,weak)}<p class="radar-note">いちばんの伸びしろは<strong>「${CATS[weak].label}」</strong>。<br>このあと見る10年後の未来で、ここがどう変わるかに注目してみてください。</p></div><div class="desc-box">${type.desc}</div>${gapCardHtml()}</div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">10年後の未来を見る</button>`;const numEl=document.getElementById('scoreNum'),barEl=document.getElementById('scoreBar');let cur=0;const step=Math.max(1,Math.round(pct/30));const timer=setInterval(()=>{cur+=step;if(cur>=pct){cur=pct;clearInterval(timer)}numEl.textContent=cur;barEl.style.width=cur+'%'},20)}

function surveyScale(name){return `<div class="survey-scale"><div class="survey-scale-label"><span>まったくそう思わない</span><span>とてもそう思う</span></div><div class="survey-scale-buttons">${Array.from({length:10},(_,i)=>`<label><input type="radio" name="${name}" value="${i+1}"><span>${i+1}</span></label>`).join('')}</div></div>`}
const SURVEY_ITEMS=[['q3','育児への関心'],['q4','育児の具体的な理解'],['q5','自分にも関係があると感じる']];
function fmtNum(v,dec){return dec?v.toFixed(1):String(Math.round(v))}
function dumbbell(label,b,a,dec){b=Number(b);a=Number(a);const pos=v=>(v-1)/9*100,lo=Math.min(pos(b),pos(a)),hi=Math.max(pos(b),pos(a)),d=a-b;return `<div class="db-row"><div class="db-head"><span>${label}</span><span class="db-vals">${fmtNum(b,dec)} → <strong>${fmtNum(a,dec)}</strong><span class="db-diff">（${d>=0?'+':''}${fmtNum(d,dec)}）</span></span></div><div class="db-track" title="診断前 ${fmtNum(b,dec)} → 診断後 ${fmtNum(a,dec)}"><div class="db-line" style="left:${lo}%;width:${hi-lo}%"></div><span class="db-dot before" style="left:${pos(b)}%"></span><span class="db-dot after" style="left:${pos(a)}%"></span></div></div>`}
function typeRange(name){const i=TYPES.findIndex(t=>t.name===name);return i<0?'':`${i?TYPES[i-1].max+1:0}〜${TYPES[i].max}点`}
function sresCard(g,mineType){const isMine=mineType&&g.diagnosis_type===mineType,title=g.diagnosis_type||'診断せずに回答',meta=[g.diagnosis_type?typeRange(g.diagnosis_type)+'のタイプ':'',`${g.count}人`,g.avg_score!=null?`平均${Math.round(g.avg_score)}点`:''].filter(Boolean).join(' ・ ');return `<section class="sres-card${isMine?' mine':''}"><div class="sres-head"><div><div class="sres-type">${title}</div><div class="sres-meta">${meta}</div></div>${isMine?'<span class="sres-tag">あなたと同じタイプ</span>':''}</div>${SURVEY_ITEMS.map(([k,l])=>dumbbell(l,g[k+'_before'],g[k+'_after'],1)).join('')}</section>`}
async function renderSurveyResults(content,footer){const mine=state.mySurvey||null,mineType=mine&&mine.diagnosis_type;content.innerHTML=`<div class="screen"><div class="eyebrow">Survey Results</div><h1 class="title" style="font-size:22px;">${mine?'ご回答ありがとうございました':'みんなのアンケート結果'}</h1><p class="lead">診断タイプ（点数）ごとに、診断前と診断後の気持ちの変化を平均でまとめています。</p><div class="db-legend"><span><i class="db-dot before"></i>診断前</span><span><i class="db-dot after"></i>診断後</span><span class="db-scale">1〜10で回答</span></div>${mine?`<section class="sres-card mine"><div class="sres-head"><div><div class="sres-type">あなたの回答</div><div class="sres-meta">${mineType?`${mineType} ・ ${mine.score}点`:'診断せずに回答'}</div></div></div>${SURVEY_ITEMS.map(([k,l])=>dumbbell(l,mine[k+'_before'],mine[k+'_after'])).join('')}</section>`:''}<div id="sresGroups"><p class="sres-loading">集計を読み込み中…</p></div></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="restart()">ホームへ戻る</button>`;const box=document.getElementById('sresGroups');try{const res=await fetch('/api/survey-results',{cache:'no-store'});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'');if(!box.isConnected)return;const order=g=>g.diagnosis_type===mineType?-1:g.diagnosis_type?TYPES.findIndex(t=>t.name===g.diagnosis_type):TYPES.length;const groups=(data.groups||[]).filter(g=>g.count>0).sort((a,b)=>order(a)-order(b));box.innerHTML=groups.length?`<div class="sres-total">これまでの回答 ${data.total}件</div>${groups.map(g=>sresCard(g,mineType)).join('')}`:'<p class="sres-loading">まだ回答がありません。</p>'}catch(error){console.error('Survey results failed:',error);if(box.isConnected)box.innerHTML='<p class="sres-loading">集計を読み込めませんでした。時間をおいてもう一度お試しください。</p>'}}
async function submitSurvey(){
  const required=['q1','q2','q3_before','q3_after','q4_before','q4_after','q5_before','q5_after'];
  document.querySelectorAll('.survey-q.missing').forEach(sec=>sec.classList.remove('missing'));
  const missing=required.filter(name=>!document.querySelector(`input[name="${name}"]:checked`)).map(name=>document.querySelector(`input[name="${name}"]`).closest('.survey-q'));
  if(missing.length){
    missing.forEach(sec=>sec.classList.add('missing'));
    missing[0].scrollIntoView({behavior:'smooth',block:'center'});
    alert('未回答の質問があります：'+missing.map(sec=>sec.querySelector('.survey-no').textContent.trim()).join('、'));
    return;
  }

  const submitButton=document.querySelector('.survey-submit');
  if(submitButton){
    submitButton.disabled=true;
    submitButton.textContent='送信中…';
  }

  const answers={};
  required.forEach(name=>{
    const input=document.querySelector(`input[name="${name}"]:checked`);
    answers[name]=input.value;
  });
  // 診断を終えてから回答した場合は、点数とタイプも一緒に保存する
  const diagnosis=getDiagnosis();
  if(diagnosis){
    answers.score=totalScorePct();
    answers.diagnosis_type=diagnosis.type;
  }
  if(state.shareEstimate!=null)answers.share_estimate=state.shareEstimate;

  try{
    const response=await fetch('/api/submit-survey',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(answers)
    });
    const result=await response.json().catch(()=>({}));

    if(!response.ok){
      throw new Error(result.error||`アンケートの送信に失敗しました（エラー ${response.status}）。`);
    }

    state.mySurvey=answers;
    go('surveyResults');
  }catch(error){
    console.error('Survey submission failed:',error);
    alert(error.message||'アンケートの送信に失敗しました。時間をおいてもう一度お試しください。');
    if(submitButton){
      submitButton.disabled=false;
      submitButton.textContent='送信';
    }
  }
}

const INFO_CATEGORIES=['すべて','お金','時間・仕事','妊娠・育児','家族・記録'];let infoFilter='すべて',matrixScale=1,matrixX=0,matrixY=0,matrixDrag=null;
function renderExternalInfo(content,footer){content.innerHTML=`<div class="screen external-screen"><div class="eyebrow">External Information</div><h1 class="title" style="font-size:22px;">外部情報</h1><p class="lead">育児や生活に役立つサービス・情報を、テーマごとにまとめています。</p><div class="info-tools"><div class="info-filters">${INFO_CATEGORIES.map(c=>`<button class="info-filter ${infoFilter===c?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div></div><div class="matrix-wrap" id="matrixWrap"><div class="matrix-canvas" id="matrixCanvas"><div class="matrix-grid"><div class="matrix-quadrant"><strong>お金</strong><span>家計・資産を整える</span></div><div class="matrix-quadrant"><strong>時間・仕事</strong><span>予定・働き方を整える</span></div><div class="matrix-quadrant"><strong>家族・記録</strong><span>家族の共有・記録</span></div><div class="matrix-quadrant"><strong>妊娠・育児</strong><span>妊娠・出産・子育て</span></div>${INFO_ITEMS.map((item,i)=>{const pos=[['24','26'],['72','24'],['28','76'],['72','74'],['43','82'],['82','56'],['56','24'],['63','68'],['86','30'],['38','45'],['60','42'],['76','46'],['68','84']][i];return `<button class="matrix-point" data-label="${item.name}" data-cat="${item.category}" style="left:${pos[0]}%;top:${pos[1]}%" aria-label="${item.name}"></button>`}).join('')}</div></div><div class="matrix-axis-x">家族・生活とのつながり →</div><div class="matrix-axis-y">サポートの必要度</div><div class="matrix-controls"><button id="matrixMinus" aria-label="縮小">−</button><button id="matrixReset" aria-label="リセット">↺</button><button id="matrixPlus" aria-label="拡大">＋</button></div></div><div class="matrix-hint">指でドラッグして移動 ／ ピンチで拡大・縮小</div><div class="info-section-title">INFORMATION LIST</div><div class="info-list" id="infoList"></div></div>`;const wrap=document.getElementById('matrixWrap'),canvas=document.getElementById('matrixCanvas');const applyTransform=()=>{canvas.style.transform=`translate(${matrixX}px,${matrixY}px) scale(${matrixScale})`};const zoomAt=(delta,cx=wrap.clientWidth/2,cy=wrap.clientHeight/2)=>{const old=matrixScale;matrixScale=Math.max(.65,Math.min(2.3,matrixScale+delta));const ratio=matrixScale/old;matrixX=cx-(cx-matrixX)*ratio;matrixY=cy-(cy-matrixY)*ratio;applyTransform()};document.getElementById('matrixMinus').onclick=()=>zoomAt(-.15);document.getElementById('matrixPlus').onclick=()=>zoomAt(.15);document.getElementById('matrixReset').onclick=()=>{matrixScale=1;matrixX=0;matrixY=0;applyTransform()};wrap.onpointerdown=e=>{if(e.target.closest&&e.target.closest('.matrix-point, .matrix-controls'))return;wrap.classList.add('dragging');wrap.setPointerCapture(e.pointerId);matrixDrag={x:e.clientX,y:e.clientY,mx:matrixX,my:matrixY}};wrap.onpointermove=e=>{if(!matrixDrag)return;matrixX=matrixDrag.mx+e.clientX-matrixDrag.x;matrixY=matrixDrag.my+e.clientY-matrixDrag.y;applyTransform()};wrap.onpointerup=wrap.onpointercancel=()=>{matrixDrag=null;wrap.classList.remove('dragging')};let pinchStart=null;wrap.ontouchstart=e=>{if(e.touches.length===2){pinchStart={dist:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),scale:matrixScale}}};wrap.ontouchmove=e=>{if(e.touches.length===2&&pinchStart){e.preventDefault();const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);matrixScale=Math.max(.65,Math.min(2.3,pinchStart.scale*(dist/pinchStart.dist)));applyTransform()}};content.querySelectorAll('.info-filter').forEach(b=>b.onclick=()=>{infoFilter=b.dataset.filter;renderExternalInfo(content,footer)});content.querySelectorAll('.matrix-point').forEach((p,i)=>p.onclick=e=>{e.preventDefault();e.stopPropagation();const item=INFO_ITEMS[i];if(window.__showExternalConfirm)window.__showExternalConfirm(item.url,item.name);});const list=document.getElementById('infoList');const filtered=infoFilter==='すべて'?INFO_ITEMS:INFO_ITEMS.filter(x=>x.category===infoFilter);list.innerHTML=filtered.map(item=>`<a class="info-item" href="${item.url}" target="_blank" rel="noopener noreferrer"><span class="info-site-icon"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(new URL(item.url).hostname)}&sz=64" alt=""></span><div class="info-title">${item.name}</div><div class="info-desc">${item.desc}</div><div class="info-meta"><span class="info-tag">${item.category}</span><span class="info-tag">${item.type}</span></div></a>`).join('');applyTransform()}
document.getElementById('brandHome').addEventListener('click',restart);document.getElementById('helpBtn').addEventListener('click',()=>document.getElementById('modalOverlay').classList.add('show'));document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modalOverlay').classList.remove('show'));render();
</script>
<script>/* unified-external-confirmation-20260906 */
(function(){
  var nativeOpen=window.open.bind(window);
  var pendingUrl=null;
  var overlay=document.createElement('div');
  overlay.id='externalConfirmOverlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(7,10,16,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-sizing:border-box';
  var box=document.createElement('div');
  box.style.cssText='width:min(310px,100%);box-sizing:border-box;padding:22px;border:1px solid var(--border);border-radius:16px;background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.35)';
  box.innerHTML='<div style="font:9px var(--font-mono);letter-spacing:.12em;color:var(--gold-dim);margin-bottom:8px">EXTERNAL SITE</div><div id="externalConfirmName" style="font:18px var(--font-body);font-weight:600;color:var(--cream);margin-bottom:10px"></div><div style="font:12px var(--font-body);line-height:1.7;color:var(--cream-dim);margin-bottom:18px">外部サイトを開きます。<br>サイトを移動してもよろしいですか？</div><div style="display:flex;gap:8px"><button id="externalConfirmCancel" type="button" style="flex:1;height:34px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--cream-dim);font:11px var(--font-body);cursor:pointer">閉じる</button><button id="externalConfirmOpen" type="button" style="flex:1;height:34px;border:1px solid var(--gold);border-radius:9px;background:var(--gold-dim);color:var(--cream);font:11px var(--font-body);cursor:pointer">開く</button></div>';
  overlay.appendChild(box);document.body.appendChild(overlay);
  function close(){pendingUrl=null;overlay.style.display='none'}
  function show(url,name){if(!url)return;pendingUrl=url;document.getElementById('externalConfirmName').textContent=name||'外部サイト';overlay.style.display='flex'}
    window.__showExternalConfirm=show;
    document.addEventListener('click',function(e){
      var p=e.target.closest&&e.target.closest('.matrix-point');
      if(!p)return;
      e.preventDefault();
      e.stopImmediatePropagation();
      var points=document.querySelectorAll('.matrix-point');
      var idx=Array.prototype.indexOf.call(points,p);
      var item=(typeof INFO_ITEMS!=='undefined'&&INFO_ITEMS[idx])?INFO_ITEMS[idx]:null;
      if(item&&window.__showExternalConfirm)window.__showExternalConfirm(item.url,item.name);
    },true);

  document.getElementById('externalConfirmCancel').addEventListener('click',close);
  document.getElementById('externalConfirmOpen').addEventListener('click',function(){var url=pendingUrl;close();if(url)nativeOpen(url,'_blank','noopener,noreferrer')});
  overlay.addEventListener('click',function(e){if(e.target===overlay)close()});
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a.info-item');if(!a)return;e.preventDefault();e.stopImmediatePropagation();show(a.href,(a.querySelector('.info-title')||a).textContent.trim())},true);
  window.open=function(url,target,features){show(String(url||''),'外部サイト');return null};
})();
</script>
</body>
