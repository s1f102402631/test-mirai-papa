<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みらいパパ ― 未来の育児シミュレーター</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="./デモアプリ.html" title="みらいパパ"></iframe>
<script>
(function(){
  const iframe=document.getElementById('app');
  let doc=null,observer=null,applying=false;
  let typeFilter='すべて',ownerFilter='すべて';
  const EXTRA=[
    {name:'厚生労働省｜共育（トモイク）プロジェクト',category:'時間・仕事',type:'行政',desc:'仕事と育児の両立や男性の育児参加に関する情報。',url:'https://tomoiku.mhlw.go.jp/'},
    {name:'パパninaru 育休シミュレーター',category:'時間・仕事',type:'それ以外',desc:'育児休業の取得期間や給付などをシミュレーションできる情報。',url:'https://192abc.com/460703'},
    {name:'子育てタウン',category:'妊娠・育児',type:'それ以外',desc:'自治体の子育て情報をまとめて確認できるサービス。',url:'https://play.google.com/store/apps/details?id=jp.mamafre.mamafre&hl=ja'},
    {name:'母子モ',category:'妊娠・育児',type:'それ以外',desc:'妊娠・出産・子育てをサポートする母子手帳アプリ。',url:'https://www.mchh.jp/login'},
    {name:'こども家庭庁｜公式YouTube',category:'妊娠・育児',type:'行政',desc:'こども・子育てに関する公式動画を発信。',url:'https://www.youtube.com/@KodomoKatei'},
    {name:'こども家庭庁｜公式X',category:'妊娠・育児',type:'行政',desc:'こども・子育て政策などの最新情報を発信。',url:'https://x.com/KodomoKatei'},
    {name:'こども家庭庁｜公式note',category:'妊娠・育児',type:'行政',desc:'こども・子育てに関する情報を発信。',url:'https://kodomo-gov.note.jp/'},
    {name:'母子健康手帳情報支援サイト',category:'妊娠・育児',type:'行政',desc:'母子健康手帳に関する公式情報を確認できるサイト。',url:'https://mchbook.cfa.go.jp/'}
  ];
  const TYPE={
    'Zaim':['アプリ','それ以外'],'マネーフォワード ME':['アプリ','それ以外'],'TimeTree':['アプリ','それ以外'],'MILIZE「ミルイゼ」':['サイト','それ以外'],'Famm':['アプリ','それ以外'],'家族アルバム みてね':['アプリ','それ以外'],'BABY365':['アプリ','それ以外'],'トツキトオカ':['アプリ','それ以外'],'ぴよログ':['アプリ','それ以外'],'ママリ':['アプリ','それ以外'],'ルナルナ':['サイト','それ以外'],
    '厚生労働省｜共育（トモイク）プロジェクト':['サイト','行政'],'パパninaru 育休シミュレーター':['サイト','それ以外'],'子育てタウン':['アプリ','それ以外'],'母子モ':['アプリ','それ以外'],'こども家庭庁｜公式YouTube':['YouTube','行政'],'こども家庭庁｜公式X':['X','行政'],'こども家庭庁｜公式note':['サイト','行政'],'こども家庭庁｜公式サイト':['サイト','行政'],'母子健康手帳情報支援サイト':['サイト','行政']
  };
  const MATRIX=[
    {title:'お金',desc:'家計・将来のお金',items:['Zaim','マネーフォワード ME','MILIZE「ミルイゼ」']},
    {title:'時間・仕事',desc:'予定・育休・働き方',items:['TimeTree','厚生労働省｜共育（トモイク）プロジェクト','パパninaru 育休シミュレーター']},
    {title:'妊娠・育児',desc:'妊娠・子育ての情報',items:['トツキトオカ','ぴよログ','ママリ','ルナルナ','子育てタウン','母子モ']},
    {title:'家族・記録',desc:'共有・思い出・成長記録',items:['Famm','家族アルバム みてね','BABY365','ぴよログ']}
  ];
  function iconUrl(item){try{return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(item.url).hostname)+'&sz=64'}catch(e){return ''}}
  function getItems(){const base=doc&&Array.isArray(doc.defaultView.INFO_ITEMS)?doc.defaultView.INFO_ITEMS.slice():[];return base.filter(x=>!EXTRA.some(e=>e.name===x.name)).concat(EXTRA)}
  function patchResultButton(){if(!doc)return;[...doc.querySelectorAll('button,.btn,a')].forEach(el=>{if((el.textContent||'').trim()==='もう一度診断する'&&!el.dataset.endPatched){el.dataset.endPatched='1';el.textContent='終了';el.addEventListener('click',()=>{const b=doc.getElementById('brandHome');if(b)b.click()})}})}
  function renderInfo(screen){
    if(!screen||applying)return;const content=screen.parentElement;const list=screen.querySelector('#infoList');const oldMatrix=screen.querySelector('.matrix-wrap');const oldTools=screen.querySelector('.info-tools');if(!list||!oldMatrix||!oldTools)return;
    applying=true;
    try{
      const items=getItems();
      const title=screen.querySelector('.title');if(title)title.textContent='情報';
      const lead=screen.querySelector('.lead');if(lead)lead.textContent='育児や生活に役立つサービス・情報をまとめています。';
      const matrixWrap=doc.createElement('div');matrixWrap.className='matrix-wrap';
      matrixWrap.innerHTML='<div class="matrix-canvas"><div class="matrix-grid">'+MATRIX.map(g=>'<div class="matrix-quadrant"><strong>'+g.title+'</strong><span>'+g.desc+'</span>'+g.items.map(n=>{const it=items.find(x=>x.name===n)||{url:''};return '<div class="matrix-service"><img src="'+iconUrl(it)+'" alt=""><span>'+n+'</span></div>'}).join('')+'</div>').join('')+'<div class="matrix-center">子育て<br>支援</div></div></div><div class="matrix-controls"><button type="button" class="matrix-minus">−</button><button type="button" class="matrix-reset">↺</button><button type="button" class="matrix-plus">＋</button></div>';
      const canvas=matrixWrap.querySelector('.matrix-canvas');let scale=.72,x=0,y=0,drag=null,pinch=null;
      const applyTransform=()=>{canvas.style.transform='translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px)) scale('+scale+')'};
      const zoomAt=(delta,cx=matrixWrap.clientWidth/2,cy=matrixWrap.clientHeight/2)=>{const old=scale;scale=Math.max(.5,Math.min(2.2,scale+delta));const r=scale/old;x=cx-(cx-x)*r;y=cy-(cy-y)*r;applyTransform()};
      matrixWrap.querySelector('.matrix-minus').onclick=()=>zoomAt(-.12);matrixWrap.querySelector('.matrix-plus').onclick=()=>zoomAt(.12);matrixWrap.querySelector('.matrix-reset').onclick=()=>{scale=.72;x=0;y=0;applyTransform()};
      matrixWrap.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&e.isPrimary===false)return;drag={x:e.clientX,y:e.clientY,mx:x,my:y};matrixWrap.setPointerCapture(e.pointerId);matrixWrap.classList.add('dragging')});
      matrixWrap.addEventListener('pointermove',e=>{if(!drag)return;x=drag.mx+e.clientX-drag.x;y=drag.my+e.clientY-drag.y;applyTransform()});
      ['pointerup','pointercancel','pointerleave'].forEach(ev=>matrixWrap.addEventListener(ev,()=>{drag=null;matrixWrap.classList.remove('dragging')}));
      matrixWrap.addEventListener('touchstart',e=>{if(e.touches.length===2){drag=null;const a=e.touches[0],b=e.touches[1];pinch={dist:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),scale}}},{passive:true});
      matrixWrap.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){e.preventDefault();const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);scale=Math.max(.5,Math.min(2.2,pinch.scale*d/pinch.dist));applyTransform()}},{passive:false});
      matrixWrap.addEventListener('touchend',()=>{pinch=null});
      oldMatrix.replaceWith(matrixWrap);
      oldTools.innerHTML='<div class="info-filter-groups"><div class="info-filter-group">'+['すべて','YouTube','X','サイト','アプリ'].map(v=>'<button type="button" class="info-filter '+(typeFilter===v?'active':'')+'" data-type-filter="'+v+'">'+v+'</button>').join('')+'</div><div class="info-filter-group">'+['すべて','行政','それ以外'].map(v=>'<button type="button" class="info-filter '+(ownerFilter===v?'active':'')+'" data-owner-filter="'+v+'">'+v+'</button>').join('')+'</div></div>';
      oldTools.querySelectorAll('[data-type-filter]').forEach(b=>b.onclick=()=>{typeFilter=b.dataset.typeFilter;renderInfo(screen)});oldTools.querySelectorAll('[data-owner-filter]').forEach(b=>b.onclick=()=>{ownerFilter=b.dataset.ownerFilter;renderInfo(screen)});
      const filtered=items.filter(item=>{const m=TYPE[item.name]||['サイト','それ以外'];return(typeFilter==='すべて'||m[0]===typeFilter)&&(ownerFilter==='すべて'||m[1]===ownerFilter)});
      list.innerHTML=filtered.map(item=>'<a class="info-item" href="'+item.url+'" target="_blank" rel="noopener noreferrer"><span class="info-site-icon"><img src="'+iconUrl(item)+'" alt=""></span><div class="info-title">'+item.name+'</div><div class="info-desc">'+item.desc+'</div></a>').join('');
      let back=screen.querySelector('.info-back-fixed');if(!back){back=doc.createElement('button');back.className='info-back-fixed';back.type='button';back.textContent='←';back.addEventListener('click',()=>{const b=doc.getElementById('brandHome');if(b)b.click()});list.insertAdjacentElement('afterend',back)}
      applyTransform();
    }finally{applying=false}
  }
  function apply(){if(!doc||!doc.body)return;patchResultButton();const s=doc.querySelector('.external-screen');if(s&&!s.dataset.infoPatched){s.dataset.infoPatched='1';renderInfo(s)}}
  function install(){doc=iframe.contentDocument;if(!doc||!doc.body)return;if(!doc.getElementById('info-layout-patch')){const style=doc.createElement('style');style.id='info-layout-patch';style.textContent=`
    .external-screen{display:flex!important;flex-direction:column!important}
    .external-screen .eyebrow{display:none!important}
    .external-screen .matrix-wrap{order:2!important;position:relative!important;height:330px!important;margin:12px -8px 10px!important;border:1px solid var(--border)!important;border-radius:18px!important;background:var(--panel-light)!important;overflow:hidden!important;touch-action:none!important;cursor:grab!important;flex-shrink:0!important}
    .external-screen .matrix-wrap.dragging{cursor:grabbing!important}
    .external-screen .matrix-canvas{position:absolute!important;left:50%!important;top:50%!important;width:560px!important;height:560px!important;transform-origin:center center!important}
    .external-screen .matrix-grid{position:absolute!important;left:20px!important;top:20px!important;width:520px!important;height:520px!important;display:grid!important;grid-template-columns:1fr 1fr!important;grid-template-rows:1fr 1fr!important;border:1px solid rgba(246,239,226,.14)!important;background:transparent!important;gap:0!important}
    .external-screen .matrix-grid::before,.external-screen .matrix-grid::after{display:none!important}
    .external-screen .matrix-quadrant{margin:8px!important;padding:12px!important;background:var(--panel-light)!important;border:1px solid var(--border)!important;border-radius:16px!important;overflow:hidden!important}
    .external-screen .matrix-quadrant strong{display:block!important;font:700 15px var(--font-body)!important;color:var(--gold)!important;margin-bottom:3px!important}
    .external-screen .matrix-quadrant>span{display:block!important;font-size:9px!important;color:var(--cream-dim)!important;margin-bottom:8px!important}
    .external-screen .matrix-service{height:34px!important;display:flex!important;align-items:center!important;gap:7px!important;padding:0 8px!important;margin-top:5px!important;background:rgba(255,255,255,.78)!important;border:1px solid var(--border)!important;border-radius:9px!important;box-sizing:border-box!important}
    .external-screen .matrix-service img{width:23px!important;height:23px!important;object-fit:contain!important;border-radius:6px!important;background:#fff!important;flex:0 0 23px!important}
    .external-screen .matrix-service span{font:600 9px var(--font-body)!important;color:var(--ink)!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
    .external-screen .matrix-center{position:absolute!important;left:50%!important;top:50%!important;width:76px!important;height:76px!important;transform:translate(-50%,-50%)!important;display:flex!important;align-items:center!important;justify-content:center!important;background:#26384e!important;border:3px solid #fff!important;border-radius:50%!important;box-shadow:0 4px 10px rgba(31,42,64,.2)!important;z-index:4!important;color:#fff!important;font:700 10px var(--font-body)!important;text-align:center!important;line-height:1.4!important;box-sizing:border-box!important}
    .external-screen .matrix-controls{display:flex!important;gap:5px!important;position:absolute!important;right:8px!important;bottom:8px!important;z-index:10!important}
    .external-screen .matrix-controls button{width:30px!important;height:30px!important;border:1px solid var(--border)!important;border-radius:8px!important;background:rgba(31,42,64,.92)!important;color:var(--cream-dim)!important;font:14px var(--font-mono)!important}
    .external-screen .info-tools{order:3!important;display:block!important;margin:0 0 10px!important}
    .external-screen .info-filter-groups{display:flex!important;flex-direction:column!important;gap:7px!important;margin:0!important}
    .external-screen .info-filter-group{display:flex!important;gap:6px!important;flex-wrap:wrap!important}
    .external-screen .info-filter-group .info-filter{padding:6px 10px!important}
    .external-screen .matrix-hint{order:4!important;margin:0 0 8px!important;font-size:9px!important}
    .external-screen .info-section-title{order:5!important}
    .external-screen .info-list{order:6!important}
    .external-screen .info-site-icon{position:absolute!important;left:14px!important;top:13px!important;width:30px!important;height:30px!important;border-radius:8px!important;border:1px solid var(--border)!important;display:flex!important;align-items:center!important;justify-content:center!important;background:#fff!important;overflow:hidden!important}
    .external-screen .info-site-icon img{width:24px!important;height:24px!important;object-fit:contain!important}
    .external-screen .info-item{position:relative!important;padding-left:54px!important}
    .external-screen .info-arrow,.external-screen .info-meta{display:none!important}
    .external-screen .info-back-fixed{order:7!important;display:flex!important;align-items:center!important;width:100%!important;margin:18px 0 2px!important;padding:0!important;border:0!important;background:transparent!important;color:var(--cream-dim)!important;font:14px var(--font-mono)!important}
  `;doc.head.appendChild(style)}if(observer)observer.disconnect();const target=doc.getElementById('content')||doc.body;observer=new MutationObserver(()=>{if(!applying)requestAnimationFrame(apply)});observer.observe(target,{childList:true,subtree:true});apply()}
  iframe.addEventListener('load',()=>setTimeout(install,50));
})();
</script>
</body>
</html>
