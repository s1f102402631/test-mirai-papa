<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みらいパパ ― 未来の育児シミュレーター</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="./デモアプリ.html" title="みらいパパ"></iframe>
<script>
(function(){
  const iframe=document.getElementById('app');
  let installed=false;

  const EXTRA=[
    {name:'厚生労働省｜共育（トモイク）プロジェクト',category:'時間・仕事',type:'行政',desc:'仕事と育児の両立や男性の育児参加に関する情報。',url:'https://tomoiku.mhlw.go.jp/'},
    {name:'パパninaru 育休シミュレーター',category:'時間・仕事',type:'それ以外',desc:'育児休業の取得期間や給付などをシミュレーションできる情報。',url:'https://192abc.com/460703'},
    {name:'子育てタウン',category:'妊娠・育児',type:'それ以外',desc:'自治体の子育て情報をまとめて確認できるサービス。',url:'https://play.google.com/store/apps/details?id=jp.mamafre.mamafre&hl=ja'},
    {name:'母子モ',category:'妊娠・育児',type:'それ以外',desc:'妊娠・出産・子育てをサポートする母子手帳アプリ。',url:'https://www.mchh.jp/login'},
    {name:'こども家庭庁｜公式YouTube',category:'妊娠・育児',type:'行政',desc:'こども・子育てに関する公式動画を発信。',url:'https://www.youtube.com/@KodomoKatei'},
    {name:'こども家庭庁｜公式X',category:'妊娠・育児',type:'行政',desc:'こども・子育て政策などの最新情報を発信。',url:'https://x.com/KodomoKatei'},
    {name:'こども家庭庁｜公式note',category:'妊娠・育児',type:'行政',desc:'こども・子育てに関する情報を発信。',url:'https://kodomo-gov.note.jp/'},
    {name:'母子健康手帳情報支援サイト',category:'妊娠・育児',type:'行政',desc:'母子健康手帳に関する公式情報を確認できるサイト。',url:'https://mchbook.cfa.go.jp/'}
  ];
  const TYPE={
    'Zaim':['アプリ','それ以外'],'マネーフォワード ME':['アプリ','それ以外'],'TimeTree':['アプリ','それ以外'],'MILIZE「ミルイゼ」':['サイト','それ以外'],'Famm':['アプリ','それ以外'],'家族アルバム みてね':['アプリ','それ以外'],'BABY365':['アプリ','それ以外'],'トツキトオカ':['アプリ','それ以外'],'ぴよログ':['アプリ','それ以外'],'ママリ':['アプリ','それ以外'],'ルナルナ':['サイト','それ以外'],
    '厚生労働省｜共育（トモイク）プロジェクト':['サイト','行政'],'パパninaru 育休シミュレーター':['サイト','それ以外'],'子育てタウン':['アプリ','それ以外'],'母子モ':['アプリ','それ以外'],'こども家庭庁｜公式YouTube':['YouTube','行政'],'こども家庭庁｜公式X':['X','行政'],'こども家庭庁｜公式note':['サイト','行政'],'こども家庭庁｜公式サイト':['サイト','行政'],'母子健康手帳情報支援サイト':['サイト','行政']
  };
  const MATRIX=[
    {title:'お金',desc:'家計・将来のお金',items:['Zaim','マネーフォワード ME','MILIZE「ミルイゼ」']},
    {title:'時間・仕事',desc:'予定・育休・働き方',items:['TimeTree','厚生労働省｜共育（トモイク）プロジェクト','パパninaru 育休シミュレーター']},
    {title:'妊娠・育児',desc:'妊娠・子育ての情報',items:['トツキトオカ','ぴよログ','ママリ','ルナルナ','子育てタウン','母子モ']},
    {title:'家族・記録',desc:'共有・思い出・成長記録',items:['Famm','家族アルバム みてね','BABY365','ぴよログ']}
  ];
  let typeFilter='すべて', ownerFilter='すべて';

  function iconUrl(item){
    try{return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(item.url).hostname)+'&sz=64'}catch(e){return 'https://www.google.com/s2/favicons?domain=google.com&sz=64'}
  }
  function getItems(doc){
    const base=Array.isArray(doc.defaultView.INFO_ITEMS)?doc.defaultView.INFO_ITEMS.slice():[];
    return base.filter(x=>!EXTRA.some(e=>e.name===x.name)).concat(EXTRA);
  }
  function setup(doc){
    const screen=doc.querySelector('.external-screen');
    if(!screen)return;
    const tools=screen.querySelector('.info-tools');
    const list=screen.querySelector('#infoList');
    const matrix=screen.querySelector('.matrix-grid');
    if(!tools||!list||!matrix)return;

    const title=screen.querySelector('.title'); if(title)title.textContent='情報';
    const lead=screen.querySelector('.lead'); if(lead)lead.textContent='育児や生活に役立つサービス・情報をまとめています。';

    matrix.innerHTML=MATRIX.map(g=>'<div class="matrix-quadrant"><strong>'+g.title+'</strong><span>'+g.desc+'</span>'+g.items.map(name=>{const item=getItems(doc).find(x=>x.name===name)||{url:''};return '<div class="matrix-service"><img src="'+iconUrl(item)+'" alt=""><span class="matrix-service-name">'+name+'</span></div>'}).join('')+'</div>').join('')+'<div class="matrix-center">子育て情報</div>';

    tools.innerHTML='<div class="info-filter-groups"><div class="info-filter-group">'+['すべて','YouTube','X','サイト','アプリ'].map(v=>'<button class="info-filter '+(typeFilter===v?'active':'')+'" data-type-filter="'+v+'">'+v+'</button>').join('')+'</div><div class="info-filter-group">'+['すべて','行政','それ以外'].map(v=>'<button class="info-filter '+(ownerFilter===v?'active':'')+'" data-owner-filter="'+v+'">'+v+'</button>').join('')+'</div></div>';

    const items=getItems(doc).filter(item=>{const m=TYPE[item.name]||['サイト','それ以外'];return (typeFilter==='すべて'||m[0]===typeFilter)&&(ownerFilter==='すべて'||m[1]===ownerFilter)});
    list.innerHTML=items.map(item=>'<a class="info-item" href="'+item.url+'" target="_blank" rel="noopener noreferrer"><span class="info-site-icon"><img src="'+iconUrl(item)+'" alt=""></span><div class="info-title">'+item.name+'</div><div class="info-desc">'+item.desc+'</div></a>').join('');

    tools.querySelectorAll('[data-type-filter]').forEach(b=>b.onclick=()=>{typeFilter=b.dataset.typeFilter;setup(doc)});
    tools.querySelectorAll('[data-owner-filter]').forEach(b=>b.onclick=()=>{ownerFilter=b.dataset.ownerFilter;setup(doc)});

    let back=screen.querySelector('.info-back-fixed');
    if(!back){back=doc.createElement('button');back.className='info-back-fixed';back.type='button';back.textContent='←';back.setAttribute('aria-label','戻る');back.onclick=()=>{const brand=doc.getElementById('brandHome');if(brand)brand.click();};list.insertAdjacentElement('afterend',back)}

    [...doc.querySelectorAll('button,.btn,a')].forEach(el=>{
      if((el.textContent||'').trim()==='もう一度診断する' && !el.dataset.endPatched){
        el.dataset.endPatched='1';el.textContent='終了';el.onclick=()=>{const brand=doc.getElementById('brandHome');if(brand)brand.click()};
      }
    });
  }

  function install(){
    const doc=iframe.contentDocument;
    if(!doc||!doc.body)return;
    if(!installed){
      installed=true;
      const style=doc.createElement('style');
      style.id='info-layout-patch';
      style.textContent=`
        .external-screen .eyebrow{display:none!important}
        .external-screen .matrix-wrap{height:690px!important;margin:10px -8px 14px!important;border:0!important;border-radius:0!important;background:transparent!important;overflow:hidden!important}
        .external-screen .matrix-canvas{width:720px!important;height:720px!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;transform-origin:center center!important}
        .external-screen .matrix-grid{left:20px!important;top:20px!important;width:680px!important;height:680px!important;border:0!important;background:transparent!important;gap:0!important}
        .external-screen .matrix-quadrant{margin:0 10px 10px;padding:15px!important;background:var(--panel-light)!important;border:1px solid var(--border)!important;border-radius:20px!important;box-shadow:0 2px 5px rgba(31,42,64,.08)!important;overflow:hidden}
        .external-screen .matrix-quadrant strong{display:block!important;font:700 17px var(--font-body)!important;color:var(--ink)!important;margin:0 0 3px!important}
        .external-screen .matrix-quadrant>span{display:block!important;font-size:10px!important;color:var(--cream-dim)!important;margin-bottom:12px!important}
        .external-screen .matrix-service{height:40px;display:flex;align-items:center;gap:9px;padding:0 10px;margin-top:7px;background:rgba(255,255,255,.78);border:1px solid var(--border);border-radius:11px;box-sizing:border-box}
        .external-screen .matrix-service img{width:27px;height:27px;object-fit:contain;border-radius:7px;flex:0 0 27px;background:#fff}
        .external-screen .matrix-service-name{font:600 10px var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .external-screen .matrix-center{position:absolute!important;left:50%!important;top:50%!important;width:106px;height:106px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;background:#26384e;border:4px solid #fff;border-radius:50%;box-shadow:0 5px 14px rgba(31,42,64,.2);z-index:4;color:#fff;font:700 12px var(--font-body);text-align:center;box-sizing:border-box}
        .external-screen .matrix-axis-x,.external-screen .matrix-axis-y{display:none!important}
        .external-screen .info-tools{display:block!important;margin:0 0 14px!important}
        .external-screen .info-filter-groups{display:flex;flex-direction:column;gap:8px;margin:0!important}
        .external-screen .info-filter-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
        .external-screen .info-filter-group .info-filter{padding:6px 10px}
        .external-screen .info-site-icon{position:absolute;left:14px;top:13px;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
        .external-screen .info-site-icon img{width:24px;height:24px;object-fit:contain}
        .external-screen .info-item{position:relative;padding-left:54px!important}
        .external-screen .info-arrow,.external-screen .info-meta{display:none!important}
        .external-screen .info-back-fixed{display:flex!important;align-items:center;justify-content:flex-start;width:100%;margin:18px 0 2px;padding:0;border:0;background:transparent;color:var(--cream-dim);font:14px var(--font-mono);cursor:pointer;text-align:left}
        .external-screen .info-back-fixed:hover{color:var(--gold)}
      `;
      doc.head.appendChild(style);
      new MutationObserver(()=>setup(doc)).observe(doc.body,{childList:true,subtree:true});
    }
    setup(doc);
  }
  iframe.addEventListener('load',()=>setTimeout(install,50));
})();
</script>
</body>
</html>
