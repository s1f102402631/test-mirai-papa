<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みらいパパ ― 未来の育児シミュレーター</title>
</head>
<body>
<p>読み込み中…</p>
<script>
(async()=>{
  const res=await fetch('./デモアプリ.html');
  let html=await res.text();
  html=html.replace('const INFO_ITEMS=', 'window.INFO_ITEMS=');
  const patch=`<style id="info-filter-patch">
.external-screen .eyebrow{display:none!important}
.external-screen .info-filter-groups{display:flex;flex-direction:column;gap:9px;margin:10px 0 12px}
.external-screen .info-filter-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.external-screen .info-filter-label{font:10px var(--font-mono);color:var(--cream-dim);min-width:28px}
.external-screen .info-filter-group .info-filter{padding:6px 10px}
.external-screen .info-site-icon{position:absolute;left:14px;top:13px;width:24px;height:24px;border-radius:7px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--gold);font:11px var(--font-mono)}
.external-screen .info-item{position:relative;padding-left:50px}
.external-screen .info-title{padding-right:20px}
</style><script>(function(){
const TYPE={
'Zaim':['アプリ','それ以外'],'マネーフォワード ME':['サイト','それ以外'],'TimeTree':['アプリ','それ以外'],'MILIZE「ミルイゼ」':['サイト','それ以外'],'Famm':['アプリ','それ以外'],'家族アルバム みてね':['アプリ','それ以外'],'BABY365':['アプリ','それ以外'],'トツキトオカ':['アプリ','それ以外'],'ぴよログ':['サイト','それ以外'],'ママリ':['サイト','それ以外'],'ルナルナ':['サイト','それ以外'],'こども家庭庁':['サイト','行政'],'厚生労働省':['サイト','行政'],'共育プロジェクト':['サイト','行政'],'こども家庭庁｜公式YouTube':['YouTube','行政'],'こども家庭庁｜公式X':['X','行政'],'こども家庭庁｜公式note':['サイト','行政'],'こども家庭庁｜公式サイト':['サイト','行政'],'母子健康手帳情報支援サイト':['サイト','行政'],'子育てタウン':['アプリ','それ以外'],'母子モ':['アプリ','それ以外']
};
const ICON={YouTube:'▶',X:'𝕏',サイト:'↗',アプリ:'▣'};
let typeFilter='すべて',ownerFilter='すべて';
function setup(){
 const screen=document.querySelector('.external-screen'); if(!screen)return false;
 const tools=screen.querySelector('.info-tools'); const list=screen.querySelector('#infoList'); if(!tools||!list)return false;
 tools.innerHTML='<div class="info-filter-groups"><div class="info-filter-group"><span class="info-filter-label">種類</span>'+['すべて','YouTube','X','サイト','アプリ'].map(v=>'<button class="info-filter '+(typeFilter===v?'active':'')+'" data-type-filter="'+v+'">'+v+'</button>').join('')+'</div><div class="info-filter-group"><span class="info-filter-label">運営</span>'+['すべて','行政','それ以外'].map(v=>'<button class="info-filter '+(ownerFilter===v?'active':'')+'" data-owner-filter="'+v+'">'+v+'</button>').join('')+'</div></div>';
 const items=Array.isArray(window.INFO_ITEMS)?window.INFO_ITEMS:[];
 const filtered=items.filter(item=>{const m=TYPE[item.name]||['サイト','それ以外'];return (typeFilter==='すべて'||m[0]===typeFilter)&&(ownerFilter==='すべて'||m[1]===ownerFilter)});
 list.innerHTML=filtered.map(item=>{const m=TYPE[item.name]||['サイト','それ以外'];return '<a class="info-item" href="'+item.url+'" target="_blank" rel="noopener noreferrer"><span class="info-site-icon" aria-hidden="true">'+(ICON[m[0]]||'↗')+'</span><span class="info-arrow">↗</span><div class="info-title">'+item.name+'</div><div class="info-desc">'+item.desc+'</div><div class="info-meta"><span class="info-tag">'+m[0]+'</span><span class="info-tag">'+m[1]+'</span></div></a>'}).join('');
 screen.querySelectorAll('[data-type-filter]').forEach(b=>b.onclick=()=>{typeFilter=b.dataset.typeFilter;setup()});
 screen.querySelectorAll('[data-owner-filter]').forEach(b=>b.onclick=()=>{ownerFilter=b.dataset.ownerFilter;setup()});
 return true;
}
function watch(){if(setup())return;requestAnimationFrame(watch)}
watch();
})();<\\/script>`;
  html=html.replace('</body>',patch+'</body>');
  document.open();document.write(html);document.close();
})().catch(()=>location.href='./デモアプリ.html');
</script>
</body>
</html>
