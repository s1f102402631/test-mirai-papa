name: Repair UI fix

"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair HTML and add confirmation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('デモアプリ.html')
          s = p.read_text(encoding='utf-8')

          # The previous patch accidentally moved the first </style> to EOF.
          if '</head>' in s:
              head = s[:s.find('</head>')]
              if '</style>' not in head:
                  s = s.replace('</head>', '</style></head>', 1)
                  if s.rstrip().endswith('</style>'):
                      s = s.rstrip()[:-len('</style>')] + '\n'

          # Ensure the home labels stay on one line and compact.
          marker = 'direct-ui-fix-20260906'
          if marker not in s:
              s = s.replace('</style>', '/* direct-ui-fix-20260906 */\n.quick-link{font-size:10.5px!important;white-space:nowrap!important;word-break:keep-all!important}\n.quick-link small{font-size:10.5px!important;white-space:nowrap!important}\n</style>', 1)

          # Add one confirmation step before opening any information link.
          if 'direct-info-confirmation-20260906' not in s:
              patch = '''<script>/* direct-info-confirmation-20260906 */\ndocument.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a.info-item');if(!a)return;if(!window.confirm(((a.querySelector('.info-title')||a).textContent||'この情報').trim()+'\\n\\n外部サイトを開きますか？')){e.preventDefault();e.stopImmediatePropagation();}},true);\n</script>\n'''
              s = s.replace('</body>', patch + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          print('HTML repaired')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'デモアプリ.html'
          git rm .github/workflows/repair-ui-fix.yml
          git commit -m 'UI修正を完成して一時ワークフローを削除'
          git push
