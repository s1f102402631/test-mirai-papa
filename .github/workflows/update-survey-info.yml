name: Update survey and info UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Update survey and info UI')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update HTML
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('デモアプリ.html')
          s=p.read_text(encoding='utf-8')

          survey = r'''function renderSurvey(content,footer){
          content.innerHTML=`<div class="screen survey-screen"><div class="eyebrow">Survey</div><h1 class="title" style="font-size:22px;">アンケート</h1><p class="lead">今のあなたの育児に対する考えを教えてください。</p><div class="survey-list">
          <section class="survey-q"><div class="survey-no">Q1</div><h2>性別を教えてください。</h2><div class="survey-options">${['男性','女性','回答しない'].map(v=>`<label><input type="radio" name="q1" value="${v}"><span>${v}</span></label>`).join('')}</div></section>
          <section class="survey-q"><div class="survey-no">Q2</div><h2>現在のご自身に最も近いものを選んでください。</h2><div class="survey-options">${['パパ・ママ','これからなる可能性が少しでもある','その他'].map(v=>`<label><input type="radio" name="q2" value="${v}"><span>${v}</span></label>`).join('')}</div></section>
          <section class="survey-q"><div class="survey-category">① 育児への関心</div><div class="survey-no">Q3</div><h2>自分が将来（あるいは今）育児をすることについて、関心がある。</h2>${surveyScale('q3')}</section>
          <section class="survey-q"><div class="survey-category">② 育児に対する理解</div><div class="survey-no">Q4</div><h2>育児とは具体的にどのようなことをするのか、理解している。</h2>${surveyScale('q4')}</section>
          <section class="survey-q"><div class="survey-category">③ 当事者意識</div><div class="survey-no">Q5</div><h2>育児は「自分にも関係のあること」だと感じている。</h2>${surveyScale('q5')}</section>
          </div><p class="survey-note">Q3〜Q5は10段階で回答してください。</p></div>`;
          footer.innerHTML=`<button class="btn btn-secondary" onclick="go('splash')">最初の画面に戻る</button>`;
          }
          function surveyScale(name){return `<div class="survey-scale"><div class="survey-scale-label"><span>まったくそう思わない</span><span>とてもそう思う</span></div><div class="survey-scale-buttons">${Array.from({length:10},(_,i)=>`<label><input type="radio" name="${name}" value="${i+1}"><span>${i+1}</span></label>`).join('')}</div></div>`}
          '''

          info = r'''function renderExternalInfo(content,footer){
          const items=[
          ['こども家庭庁','こども・子育てに関する制度や施策などの情報。','https://www.cfa.go.jp/'],
          ['厚生労働省','育児休業や仕事と子育ての両立に関する情報。','https://www.mhlw.go.jp/']
          ];
          content.innerHTML=`<div class="screen external-screen"><div class="eyebrow">External Information</div><h1 class="title" style="font-size:22px;">外部情報</h1><p class="lead">育児や子育てについて、さらに知りたいときの情報源です。</p><div class="external-list">${items.map(x=>`<a class="external-card" href="${x[2]}" target="_blank" rel="noopener noreferrer"><div class="external-icon">↗</div><div><div class="info-title">${x[0]}</div><div class="info-desc">${x[1]}</div></div></a>`).join('')}</div></div>`;
          footer.innerHTML=`<button class="btn btn-secondary" onclick="go('splash')">最初の画面に戻る</button>`;
          }
          '''

          s=re.sub(r'function renderSurvey\(content,footer\)\{.*?\nfunction renderExternalInfo', survey+'function renderExternalInfo', s, count=1, flags=re.S)
          s=re.sub(r'function renderExternalInfo\(content,footer\)\{.*?\ndocument\.getElementById\(\'helpBtn\'\)', info+"document.getElementById('helpBtn')", s, count=1, flags=re.S)

          splash_old=re.search(r'function renderSplash\(content,footer\)\{.*?\nfunction renderOpening', s, flags=re.S)
          if splash_old:
            splash_new=r'''function renderSplash(content,footer){content.innerHTML=`<div class="screen"><div class="splash-art"><div class="moon"></div><div class="silhouette"><div class="figure"></div><div class="figure small"></div><div class="figure" style="height:48px"></div></div></div><div class="eyebrow">Mirai Papa Simulator</div><h1 class="title">あなたの選択が、<br>未来の家族をつくる。</h1><p class="lead">将来の自分と家族の姿を、12の質問でシミュレーションしてみましょう。育児に関わるかどうかで、10年後の家族はどう変わる？</p></div>`;footer.innerHTML=`<button class="btn btn-primary" onclick="next()">はじめる</button><div class="quick-links compact-links"><button class="quick-link icon-link" onclick="go('survey')"><span class="quick-icon">📝</span><small>アンケート</small></button><button class="quick-link icon-link" onclick="go('externalInfo')"><span class="quick-icon external-box">↗</span><small>情報</small></button></div>`}
          function renderOpening'''
            s=s[:splash_old.start()]+splash_new+s[splash_old.end()-len('function renderOpening'):]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Add styles
        run: |
          cat >> style.css <<'CSS'
          .compact-links{gap:18px;justify-content:center;padding-top:2px}.icon-link{border:0!important;background:transparent!important;min-height:42px;flex-direction:column;gap:3px;padding:2px 12px}.icon-link:hover{border:0!important;background:transparent!important}.quick-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}.icon-link small{font-size:10px;color:var(--cream-dim);font-family:var(--font-body)}.external-box{font-family:var(--font-mono);font-size:20px;border:1px solid var(--cream-dim);border-radius:4px}.survey-list{display:flex;flex-direction:column;gap:12px;margin-top:18px}.survey-q{padding:18px;border:1px solid var(--border);border-radius:16px;background:var(--panel-light)}.survey-no{font-family:var(--font-mono);font-size:11px;color:var(--gold);margin-bottom:6px}.survey-q h2{font-family:var(--font-display);font-size:16px;line-height:1.7;font-weight:500;margin-bottom:14px}.survey-category{font-family:var(--font-mono);font-size:11px;color:var(--gold);margin-bottom:7px}.survey-options{display:flex;flex-direction:column;gap:8px}.survey-options label{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;color:var(--cream-dim);font-size:13px;cursor:pointer}.survey-options input,.survey-scale-buttons input{accent-color:var(--gold)}.survey-scale-label{display:flex;justify-content:space-between;color:var(--cream-dim);font-size:9px;margin-bottom:8px}.survey-scale-buttons{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.survey-scale-buttons label{display:flex;justify-content:center}.survey-scale-buttons span{width:100%;text-align:center;padding:8px 2px;border:1px solid var(--border);border-radius:7px;font-family:var(--font-mono);font-size:11px;color:var(--cream-dim)}.survey-scale-buttons input{position:absolute;opacity:0}.survey-scale-buttons input:checked+span{background:var(--gold);border-color:var(--gold);color:#241A09}.survey-note{font-size:10px;color:var(--cream-dim);text-align:center;margin:12px 0}.external-list{display:flex;flex-direction:column;gap:12px;margin-top:18px}.external-card{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);border-radius:15px;background:var(--panel-light);color:var(--cream);text-decoration:none}.external-card:hover{border-color:var(--gold)}.external-icon{width:36px;height:36px;flex-shrink:0;border:1px solid var(--cream-dim);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:20px;color:var(--gold)}
          CSS
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'デモアプリ.html' style.css
          git diff --cached --quiet || git commit -m 'Update survey and info UI'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/update-survey-info.yml
          git commit -m 'Remove temporary update workflow'
          git push
