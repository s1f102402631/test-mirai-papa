name: Fix map external confirmation
on:
  push:
    paths:
      - '.github/workflows/fix-map-external-confirm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map external confirmation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('デモアプリ.html')
          s=p.read_text(encoding='utf-8')
          old="function show(url,name){if(!url)return;pendingUrl=url;document.getElementById('externalConfirmName').textContent=name||'外部サイト';overlay.style.display='flex'}"
          new=old+"\n    window.__showExternalConfirm=show;"
          if "window.__showExternalConfirm=show;" not in s:
              if old not in s:
                  raise SystemExit('confirmation function not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'デモアプリ.html'
          git diff --cached --quiet && exit 0
          git commit -m 'Expose external confirmation handler for map'
          git push