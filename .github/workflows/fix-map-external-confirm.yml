name: Fix map external confirmation
on:
  push:
    paths:
      - '.github/workflows/fix-map-external-confirm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map click handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('デモアプリ.html')
          s=p.read_text(encoding='utf-8')
          old="content.querySelectorAll('.matrix-point').forEach((p,i)=>p.onclick=e=>{e.stopPropagation();const item=INFO_ITEMS[i];window.open(item.url,'_blank','noopener,noreferrer')});"
          new="content.querySelectorAll('.matrix-point').forEach((p,i)=>p.onclick=e=>{e.preventDefault();e.stopPropagation();const item=INFO_ITEMS[i];if(window.__showExternalConfirm)window.__showExternalConfirm(item.url,item.name);});"
          if old not in s:
              raise SystemExit('target handler not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'デモアプリ.html'
          git diff --cached --quiet && exit 0
          git commit -m 'Fix map external confirmation UI'
          git push