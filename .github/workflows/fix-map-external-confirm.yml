name: Fix map external confirmation
on:
  push:
    paths:
      - '.github/workflows/fix-map-external-confirm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map point click handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('デモアプリ.html')
          s=p.read_text(encoding='utf-8')
          old="wrap.onpointerdown=e=>{wrap.classList.add('dragging');wrap.setPointerCapture(e.pointerId);matrixDrag={x:e.clientX,y:e.clientY,mx:matrixX,my:matrixY}};"
          new="wrap.onpointerdown=e=>{if(e.target.closest&&e.target.closest('.matrix-point, .matrix-controls'))return;wrap.classList.add('dragging');wrap.setPointerCapture(e.pointerId);matrixDrag={x:e.clientX,y:e.clientY,mx:matrixX,my:matrixY}};"
          if old not in s:
              raise SystemExit('pointerdown handler not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'デモアプリ.html'
          git diff --cached --quiet && exit 0
          git commit -m 'Fix clickable map points'
          git push