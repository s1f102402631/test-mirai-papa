name: Apply UI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Repair generated index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # The previous patch accidentally generated a JavaScript string
          # containing a literal newline after html.replace('. That makes
          # the whole bootstrap script fail with SyntaxError.
          pattern = r'''  html\.replace\('\n<style id="final-info-layout-fix">.*?\n</body>',patch\+'\</body>'\);'''
          replacement = "  html=html.replace('</body>',patch+'</body>');"
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)

          if n == 0:
              # Also handle the exact malformed form if escaping differs.
              start = "  html=html.replace('\\n<style id=\"final-info-layout-fix\">"
              if start in s:
                  a = s.index(start)
                  b = s.index("  document.open();", a)
                  s = s[:a] + replacement + "\n" + s[b:]

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('Repaired index.html')
          else:
              print('No repair needed')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m '読み込み停止のSyntaxErrorを修正'
            git push
          fi
